name: ddubi

# ---------------------------------------------------------------------------
# 공통 설정 (YAML anchor)
#  - 로그 로테이션: 10MB x 3 파일
#  - 모든 서비스는 ddubi-network 하나에 붙고 mem_limit 을 가진다
#  - 프로필: core / collect / data / spark / archive / hdfs / monitoring
#    (예) docker compose --profile core up -d
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks:
    - ddubi-network

# 수집기 5개가 공유하는 정의. 소스별로 COLLECTOR_SOURCE 만 다르다.
x-collector: &collector
  <<: *common
  build:
    context: ..
    dockerfile: collector/Dockerfile
  image: ddubi/collector:${APP_VERSION:-0.1.0}
  profiles: ["collect"]
  mem_limit: 256m
  depends_on:
    kafka:
      condition: service_healthy
      required: false   # core 프로필 없이 collect 만 켤 때도 정의가 깨지지 않게

x-collector-env: &collector-env
  TZ: ${TZ:-Asia/Seoul}
  APP_ENV: ${APP_ENV:-local}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-}   # 비우면 소스별 기본 주기
  WEATHER_GRID_POINTS: ${WEATHER_GRID_POINTS:-}                 # 비우면 서울 25개 구
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
  SEOUL_API_KEY: ${SEOUL_API_KEY:-}
  DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
  KMA_API_KEY: ${KMA_API_KEY:-}

# Spark 3개 노드가 공유하는 마운트. 설정은 infra/spark/conf/ 디렉터리를 /opt/spark/conf 에 마운트
# (파일 하나를 마운트하면 git pull 로 파일이 교체돼도 컨테이너는 옛 inode 를 계속 봐서 재생성 전엔 반영되지 않는다.
#  디렉터리 마운트는 그 문제가 없다 — 2026-09-03 spark-defaults 변경이 반영되지 않은 사고에서 배움).
# 로컬 볼륨 경로는 고정. SPARK_CHECKPOINT_DIR/SPARK_EVENTLOG_DIR 는 이 경로(2단계) 또는 hdfs://...(3단계) 를 가리킨다.
x-spark-volumes: &spark-volumes
  - ./spark/conf:/opt/spark/conf:ro
  - ../sparkjobs:/opt/ddubi/sparkjobs
  - spark-checkpoints:/opt/ddubi/checkpoints
  - spark-events:/opt/ddubi/spark-events

# HDFS 3개 노드가 공유하는 정의. 설정은 infra/hdfs/*.xml 마운트.
x-hdfs: &hdfs
  <<: *common
  image: apache/hadoop:${HADOOP_VERSION:-3.4.1}
  profiles: ["hdfs"]
  mem_limit: 1g
  # 이미지 기본 사용자(hadoop)는 도커가 만든 볼륨 디렉터리(root 소유)에 쓸 수 없어 root 로 실행한다
  user: root
  environment:
    TZ: ${TZ:-Asia/Seoul}
    # 이미지의 자바 8(1.8.0_212)은 cgroup v2 메모리 제한을 못 읽어 힙을 호스트 기준(16GB/4)으로 잡는다.
    # 1GiB 제한 안에서 죽지 않게 힙 상한을 명시 (2026-09-03 네임노드 OOM 재발 방지)
    HADOOP_HEAPSIZE_MAX: 512m

services:
  # =========================================================================
  # core : Kafka(KRaft 단일 노드) + Kafka UI                       [서버1]
  # =========================================================================
  kafka:
    <<: *common
    image: apache/kafka:${KAFKA_VERSION:-3.9.1}
    container_name: kafka
    profiles: ["core"]
    mem_limit: 2g
    ports:
      - "29092:29092"            # 호스트(개발 PC)에서 접근하는 리스너
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # --- KRaft (broker + controller 겸용 단일 노드) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 이중 리스너: 컨테이너 내부 kafka:9092 / 호스트 localhost:29092 ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 토픽 기본값: 파티션 3, 단일 브로커라 복제 1 ---
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 docs/contracts/topics.yaml 기준으로 scripts/create-topics.sh 가 만든다. 자동 생성 금지
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # --- 보존: 21일(504h). HDFS 정착 후에만 단축 ---
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    <<: *common
    # provectuslabs 는 개발 중단(v0.7.2 가 마지막)이라 최신 Kafka 의 offset 을 잘못 읽는다.
    # 후속 프로젝트 kafbat/kafka-ui 로 교체 (Overview·Messages 의 메시지 수·offset 오독 해결)
    image: ${KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui}:${KAFKA_UI_VERSION:-v1.1.0}
    container_name: kafka-ui
    profiles: ["core"]
    mem_limit: 512m
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KAFKA_CLUSTERS_0_NAME: ddubi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # =========================================================================
  # collect : Python 수집기 x5 (Kafka 발행만 담당)                [서버1]
  #  - collect          : 구현되어 실제로 돌리는 수집기 (지금은 weather)
  #  - collect-pending  : 미구현 수집기. 켜면 소스 없음으로 재시작을 반복하므로 배포에서 제외한다.
  #                       구현이 끝나면 해당 서비스의 profiles 를 ["collect"] 로 바꾼다
  # =========================================================================
  collector-bus:
    <<: *collector
    container_name: collector-bus
    profiles: ["collect-pending"]   # 미구현
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: bus

  collector-subway:
    <<: *collector
    container_name: collector-subway
    profiles: ["collect-pending"]   # 미구현
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: subway

  collector-traffic:
    <<: *collector
    container_name: collector-traffic
    profiles: ["collect-pending"]   # 미구현
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: traffic

  collector-weather:
    <<: *collector
    container_name: collector-weather
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: weather

  collector-event:
    <<: *collector
    container_name: collector-event
    profiles: ["collect-pending"]   # 미구현
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: event

  # =========================================================================
  # data : MySQL, Redis                                             [서버2]
  #  - 주 DB 는 MySQL. 공간 연산은 DB 에서 하지 않고 수집·전처리 단계에서 segment_id 로 변환한다.
  #  - 3306 은 외부 공개 금지. 호스트 포트는 127.0.0.1 에만 묶는다 (개발 도구 접속용). Backend 는 mysql:3306 으로 붙는다
  # =========================================================================
  mysql:
    <<: *common
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql
    profiles: ["data"]
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --slow-query-log=ON
      - --long-query-time=1
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 초기화 중에는 소켓 전용 임시 서버가 먼저 뜨므로 TCP(127.0.0.1)로 확인해야 거짓 healthy 가 없다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *common
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: redis
    profiles: ["data"]
    mem_limit: 512m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 384mb
      # 메모리가 차면 TTL 이 있는 키 중 만료가 가까운 것부터 지운다 (volatile-ttl).
      # 캐시(weather:latest 2h, route:candidates 10m)가 먼저 나가고 상태 키(auth:refresh 14d, idem 24h)는 마지막까지 남는다.
      # TTL 없는 키는 절대 퇴출되지 않으므로 docs/contracts/redis-keys.yaml 에 명시된 것만 TTL 없이 넣는다 (2026-09-03 점검 결정)
      - --maxmemory-policy
      - volatile-ttl
      - --appendonly
      - "yes"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  # =========================================================================
  # serving : Backend(Spring) + Nginx                               [서버2]
  #  - data 프로필과 함께 띄운다 (mysql·redis 필요): --profile data --profile serving
  #  - backend 는 첫 기동 때 Flyway 마이그레이션이 스키마를 만든다 (테이블 수동 생성 불필요)
  #  - 외부 공개는 nginx 의 80/443 뿐. backend 는 호스트 포트를 열지 않는다
  #  - JWT_SECRET 이 비어 있으면 backend 가 기동을 거부한다 (.env 에 반드시 설정)
  # =========================================================================
  backend:
    <<: *common
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ddubi/backend:${APP_VERSION:-0.1.0}
    container_name: backend
    profiles: ["serving"]
    mem_limit: 1g
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BACKEND_PORT: 8080
      # 같은 도커 네트워크라 서비스 이름으로 접속한다 (서버 IP 불필요)
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      JAVA_OPTS: -Xms256m -Xmx512m
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s   # 첫 기동은 Flyway 마이그레이션 때문에 오래 걸릴 수 있다

  nginx:
    <<: *common
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: nginx
    profiles: ["serving"]
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # templates/*.template 의 ${변수} 가 기동 시 치환된다 (envsubst)
      SERVER1_PRIVATE_IP: ${SERVER1_PRIVATE_IP:-127.0.0.1}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - certbot-certs:/etc/letsencrypt:ro      # certbot 이 발급한 인증서를 읽는다
      - certbot-webroot:/var/www/certbot:ro    # LE 도메인 검증 파일 서빙
    depends_on:
      backend:
        condition: service_healthy
        required: false

  # 인증서 발급·자동 갱신 (Let's Encrypt). 12시간마다 깨어나 만료 30일 전이면 갱신한다.
  # 최초 발급은 수동 1회: infra/README.md 의 HTTPS 절 참고 (nginx 중지 후 standalone 발급)
  # 주의: 인증서가 없는 로컬에서는 nginx(443 설정)가 뜨지 못한다 — 로컬 개발은 backend 만 띄우고 8080 직접 호출
  certbot:
    <<: *common
    image: certbot/certbot:${CERTBOT_VERSION:-v2.11.0}
    container_name: certbot
    profiles: ["serving"]
    mem_limit: 128m
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done'
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  # =========================================================================
  # spark : Master + Worker x2 (PySpark 커스텀 이미지)              [서버1]
  #  - 체크포인트/이벤트로그 위치는 SPARK_CHECKPOINT_DIR / SPARK_EVENTLOG_DIR 환경변수로 주입.
  #    2단계: /opt/ddubi/checkpoints (로컬 볼륨) → 3단계: hdfs://hdfs-namenode:9000/ddubi/checkpoints
  # =========================================================================
  spark-master:
    <<: *common
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
      args:
        SPARK_IMAGE: apache/spark:${SPARK_VERSION:-3.5.3-python3}
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-master
    profiles: ["spark", "experiment"]
    mem_limit: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "7077:7077"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HDFS_NAMENODE_URI: ${HDFS_NAMENODE_URI}
    volumes: *spark-volumes

  spark-worker-1:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-1
    profiles: ["spark", "experiment"]
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  spark-worker-2:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-2
    profiles: ["spark"]
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  # 부하 실험에서만 켜는 세 번째 worker. 기본 spark 프로필에는 포함하지 않는다.
  spark-worker-3:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-3
    profiles: ["experiment"]
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  # 스트리밍 잡 드라이버 (client 모드). 잡 하나당 서비스 하나. 실행: sparkjobs/submit.sh
  spark-streaming-weather:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-weather
    profiles: ["spark"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/weather_latest.py"]
    ports:
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 부하 실험용 스트리밍 인스턴스 (experiment 프로필). 운영 잡과 같은 코드를 환경변수만 바꿔 띄운다:
  #  - city.replay(재생 토픽)를 읽고 Redis 는 weather:replay:* 에만 써서 운영 키를 건드리지 않는다
  #  - 체크포인트도 별도(weather_replay), 진행률은 Spark UI 의 Input Rows 로 측정한다
  #  - 처리량 상한(maxOffsetsPerTrigger)을 크게 풀어 worker 수 차이가 드러나게 한다
  # 실험 중에는 운영 스트리밍(spark-streaming-weather)을 잠시 멈춰 워커 자원을 전부 넘기는 것을 권장
  spark-streaming-replay:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-replay
    profiles: ["experiment"]
    restart: "no"
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/weather_latest.py"]
    ports:
      - "4041:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_JOB_NAME: weather_replay
      SPARK_JOB_TOPIC: city.replay
      REDIS_KEY_PREFIX: weather:replay
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${EXPERIMENT_MAX_OFFSETS_PER_TRIGGER:-200000}
      SPARK_STARTING_OFFSETS: latest
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_EXECUTOR_MEMORY: ${EXPERIMENT_EXECUTOR_MEMORY:-1g}
      SPARK_CORES_MAX: ${EXPERIMENT_CORES_MAX:-6}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1

  # 배치 잡 실행기 (일회성). 예: docker compose --profile batch run --rm spark-batch sh submit.sh batch/weather_baseline.py --days 28
  spark-batch:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-batch
    profiles: ["batch"]
    restart: "no"
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "-c", "echo 'usage: docker compose --profile batch run --rm spark-batch sh submit.sh batch/<job>.py [args]'"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BASELINE_INPUT_URI: ${BASELINE_INPUT_URI}
      BASELINE_OUTPUT_URI: ${BASELINE_OUTPUT_URI}
      BASELINE_WINDOW_DAYS: ${BASELINE_WINDOW_DAYS:-28}
      # 기준선 업로드 API (비우면 업로드 생략 — 구간 기준선 배치에서 사용 예정)
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # 스트리밍 실행기(1g x2)가 워커 메모리(1536m x2)를 먼저 쓰고 있어, 배치는 남는 몫(≈500m) 안에서 돈다.
      # 더 크게 잡으면 자원을 못 받아 무한 대기하고, Spark 최소값(450m) 보다 작으면 시작을 거부한다. 워커 메모리를 늘리면 함께 올린다.
      SPARK_EXECUTOR_MEMORY: ${BATCH_EXECUTOR_MEMORY:-480m}
      SPARK_DRIVER_MEMORY: ${BATCH_DRIVER_MEMORY:-512m}
      SPARK_CORES_MAX: ${BATCH_CORES_MAX:-2}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy

  # =========================================================================
  # archive : Kafka -> Parquet 아카이버                            [서버1]
  #  - 2단계: ARCHIVE_URI=file://<ARCHIVE_LOCAL_DIR> 로컬 볼륨 / 3단계: webhdfs://hdfs-namenode:9870/... 로 값만 변경
  #  - 1시간 또는 128MB 단위 병합 (small files 방지). 파일을 쓴 뒤에만 오프셋 커밋
  # =========================================================================
  archiver:
    <<: *common
    build:
      context: ..
      dockerfile: archiver/Dockerfile
    image: ddubi/archiver:${APP_VERSION:-0.1.0}
    container_name: archiver
    profiles: ["archive"]
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Asia/Seoul}
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARCHIVE_TOPICS: ${ARCHIVE_TOPICS:-transport.raw,city.raw}   # topics.yaml 의 archive: true 토픽
      ARCHIVE_LOCAL_DIR: ${ARCHIVE_LOCAL_DIR}
      ARCHIVE_URI: ${ARCHIVE_URI}
      ARCHIVE_HDFS_USER: ${ARCHIVE_HDFS_USER:-hadoop}
      ARCHIVE_FLUSH_MINUTES: ${ARCHIVE_FLUSH_MINUTES:-60}
      ARCHIVE_FLUSH_SECONDS: ${ARCHIVE_FLUSH_SECONDS:-}            # 개발·검증용. 비우면 분 단위 사용
      ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-134217728}
    volumes:
      - archive-data:${ARCHIVE_LOCAL_DIR}
    depends_on:
      kafka:
        condition: service_healthy
        required: false

  # 아카이브 재생기 (일회성, 부하 실험·시연용). archiver 이미지 재사용.
  # 원본 토픽이 아니라 전용 재생 토픽(예: city.replay)으로 발행한다 — 아카이버 재수집 오염 방지.
  # 예: docker compose --profile replay run --rm replay-producer \
  #       python -m replay --source-topic city.raw --target-topic city.replay \
  #       --from-date 2026-08-31 --to-date 2026-09-01 --rate 500 --limit 50000
  replay-producer:
    <<: *common
    build:
      context: ..
      dockerfile: archiver/Dockerfile
    image: ddubi/archiver:${APP_VERSION:-0.1.0}
    container_name: replay-producer
    profiles: ["replay"]
    restart: "no"
    mem_limit: 512m
    command: ["sh", "-c", "echo 'usage: docker compose --profile replay run --rm replay-producer python -m replay --help'"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARCHIVE_URI: ${ARCHIVE_URI}
      ARCHIVE_HDFS_USER: ${ARCHIVE_HDFS_USER:-hadoop}

  # =========================================================================
  # hdfs : NameNode + DataNode1 [서버1], DataNode2 [서버2]
  #  - namenode 는 최초 1회만 포맷하고 이후엔 그대로 기동한다.
  #  - 클라이언트(archiver→WebHDFS 9870, Spark→RPC 9000)는 데이터노드에 호스트명으로 접근한다.
  #    서버 2대로 나눌 때는 상대 서버 데이터노드 이름을 extra_hosts 로 사설 IP 에 매핑해야 한다.
  # =========================================================================
  hdfs-namenode:
    <<: *hdfs
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    command:
      - sh
      - -c
      - |
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          hdfs namenode -format -nonInteractive
        fi
        exec hdfs namenode
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # NameNode RPC
    volumes:
      # HDFS 설정은 단일 파일 마운트를 유지한다 (이미지의 /opt/hadoop/etc/hadoop 에 다른 필수 파일이 많아 디렉터리로 덮을 수 없음).
      # 따라서 *.xml 을 고쳐 배포한 뒤에는 반드시 재생성: up -d --force-recreate hdfs-namenode hdfs-datanode1 (서버2: hdfs-datanode2)
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/hadoop/dfs/name

  hdfs-datanode1:
    <<: *hdfs
    container_name: hdfs-datanode1
    hostname: hdfs-datanode1
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode1-data:/hadoop/dfs/data
    depends_on:
      - hdfs-namenode

  hdfs-datanode2:
    <<: *hdfs
    container_name: hdfs-datanode2
    hostname: hdfs-datanode2
    # 서버2 전용 프로필. 서버1의 hdfs 프로필(namenode+datanode1)에 딸려가지 않게 분리했다.
    # 로컬(한 대)에서 복제 2를 채우려면 --profile hdfs --profile hdfs2 둘 다 켠다
    profiles: ["hdfs2"]
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode2-data:/hadoop/dfs/data
    depends_on:
      hdfs-namenode:
        condition: service_started
        required: false   # hdfs2 단독 기동 시 namenode 정의가 비활성이어도 깨지지 않게

  # =========================================================================
  # monitoring : Prometheus / Grafana / kafka-exporter [서버2], node-exporter [양쪽]
  # =========================================================================
  prometheus:
    <<: *common
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/ddubi/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      # 디렉터리 마운트 (단일 파일 마운트는 git pull 교체가 컨테이너에 반영되지 않음). 이미지의 /etc/prometheus 는 그대로 두고 하위 경로에 붙인다
      - ./monitoring/prometheus:/etc/prometheus/ddubi:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.1}
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION:-v1.8.0}
    container_name: kafka-exporter
    # Kafka 와 같은 서버(서버1)에서 exporters 프로필로 띄운다. Prometheus(서버2)가 9308 을 원격 스크랩
    profiles: ["exporters"]
    mem_limit: 128m
    command:
      - --kafka.server=${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9308:9308"

  node-exporter:
    <<: *common
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    container_name: node-exporter
    profiles: ["monitoring", "exporters"]   # 서버1은 exporters, 서버2는 monitoring 으로 양쪽 다 뜬다
    mem_limit: 128m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

networks:
  ddubi-network:
    name: ddubi-network

volumes:
  certbot-certs:
  certbot-webroot:
  mysql-data:
  redis-data:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode1-data:
  hdfs-datanode2-data:
  spark-checkpoints:
  spark-events:
  spark-ivy:
  archive-data:
  prometheus-data:
  grafana-data:
