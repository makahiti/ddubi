name: ddubi

# ---------------------------------------------------------------------------
# 공통 설정 (YAML anchor)
#  - 로그 로테이션: 10MB x 3 파일
#  - 모든 서비스는 ddubi-network 하나에 붙고 mem_limit 을 가진다
#  - 프로필: core / collect / data / spark / archive / hdfs / monitoring
#    (예) docker compose --profile core up -d
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks:
    - ddubi-network

# 모든 수집기가 공유하는 정의. 소스별로 COLLECTOR_SOURCE 만 다르다.
x-collector: &collector
  <<: *common
  build:
    context: ..
    dockerfile: collector/Dockerfile
  image: ddubi/collector:${APP_VERSION:-0.1.0}
  profiles: ["collect"]
  mem_limit: 256m
  volumes:
    - collector-budget:/app/data
    # 수도권 버스 대응표(정류장 ID → 인접 구간 segment_id). 저장소 파일을 읽기 전용으로 붙인다.
    # 버스 수집기 2개만 읽고 나머지는 무시한다. 파일·SHA 는 backend/transit-master/bus/*.manifest.json 이 진실
    - ../backend/transit-master:/opt/ddubi/transit-master:ro
  depends_on:
    kafka:
      condition: service_healthy
      required: false   # core 프로필 없이 collect 만 켤 때도 정의가 깨지지 않게

x-collector-env: &collector-env
  TZ: ${TZ:-Asia/Seoul}
  APP_ENV: ${APP_ENV:-local}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-}   # 비우면 소스별 기본 주기
  WEATHER_GRID_POINTS: ${WEATHER_GRID_POINTS:-}                 # 비우면 서울 25개 구
  # --- 포털별 공통 키 우선. 기존 소스별 변수는 배포 전환용 fallback ---
  KMA_API_KEY: ${KMA_API_KEY:-}                                 # weather (우선)
  DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}                   # weather (KMA 없을 때)
  SEOUL_OPEN_DATA_API_KEY: ${SEOUL_OPEN_DATA_API_KEY:-}         # 서울 열린데이터광장 일반키
  BUS_ARRIVAL_API_KEY: ${BUS_ARRIVAL_API_KEY:-}
  BUS_LOCATION_API_KEY: ${BUS_LOCATION_API_KEY:-}
  SUBWAY_API_KEY: ${SUBWAY_API_KEY:-}                           # subway_arrival, subway_location
  SUBWAY_ALERT_API_KEY: ${SUBWAY_ALERT_API_KEY:-}
  CITY_REALTIME_API_KEY: ${CITY_REALTIME_API_KEY:-}
  TOPIS_NOTICE_API_KEY: ${TOPIS_NOTICE_API_KEY:-}
  TRAFFIC_INCIDENT_API_KEY: ${TRAFFIC_INCIDENT_API_KEY:-}
  # --- 호출 예산: 실제 키 값이 같은 변수끼리 합산해 최근 24시간 한도. sqlite 는 수집기 공용 볼륨(collector-budget) ---
  API_DAILY_LIMIT: ${API_DAILY_LIMIT:-900}
  API_BUDGET_PATH: /app/data/request_budget.sqlite3
  # --- 수집 범위(비우면 코드 안 기본값: 버스 노선 config/bus_route_ids.json, 도시 121장소 config/city_areas.json) ---
  BUS_ROUTE_IDS: ${BUS_ROUTE_IDS:-}
  BUS_ROUTE_LIMIT: ${BUS_ROUTE_LIMIT:-100}
  SUBWAY_LINES: ${SUBWAY_LINES:-}
  SUBWAY_SKIP_ENABLED: ${SUBWAY_SKIP_ENABLED:-true}
  SUBWAY_SKIP_START: ${SUBWAY_SKIP_START:-03:30}
  SUBWAY_SKIP_END: ${SUBWAY_SKIP_END:-04:30}
  SUBWAY_SKIP_OVERRIDE_DATES: ${SUBWAY_SKIP_OVERRIDE_DATES:-}
  CITY_AREA_IDENTIFIERS: ${CITY_AREA_IDENTIFIERS:-}
  CITY_AREA_REGISTRY_PATH: ${CITY_AREA_REGISTRY_PATH:-}
  # 버스 대응표 위치와 파일 지문(SHA-256). 지문이 틀리면 버스 수집기는 기동을 거부한다(재시작 반복).
  # 기본값을 여기(compose)에 두는 이유: 파일이 저장소에 있으니 지문도 같은 커밋에서 함께 바뀌어야 한다.
  # 파일을 새로 만들면 backend/transit-master/bus/metropolitan-bus-v6.crosswalk.json.manifest.json 의 sha256 으로 갱신
  BUS_CROSSWALK_PATH: ${BUS_CROSSWALK_PATH:-/opt/ddubi/transit-master/bus/metropolitan-bus-v6.crosswalk.json.gz}
  BUS_CROSSWALK_SHA256: ${BUS_CROSSWALK_SHA256:-8014da5e1453d426789fa396622a0f0e4069ac484db76860348af517adc1f246}

# Spark 3개 노드가 공유하는 마운트. 설정은 infra/spark/conf/ 디렉터리를 /opt/spark/conf 에 마운트
# (파일 하나를 마운트하면 git pull 로 파일이 교체돼도 컨테이너는 옛 inode 를 계속 봐서 재생성 전엔 반영되지 않는다.
#  디렉터리 마운트는 그 문제가 없다 — 2026-09-03 spark-defaults 변경이 반영되지 않은 사고에서 배움).
# 로컬 볼륨 경로는 고정. SPARK_CHECKPOINT_DIR/SPARK_EVENTLOG_DIR 는 이 경로(2단계) 또는 hdfs://...(3단계) 를 가리킨다.
x-spark-volumes: &spark-volumes
  - ./spark/conf:/opt/spark/conf:ro
  - ../sparkjobs:/opt/ddubi/sparkjobs
  - spark-checkpoints:/opt/ddubi/checkpoints
  - spark-events:/opt/ddubi/spark-events

# HDFS 3개 노드가 공유하는 정의. 설정은 infra/hdfs/*.xml 마운트.
x-hdfs: &hdfs
  <<: *common
  image: apache/hadoop:${HADOOP_VERSION:-3.4.1}
  profiles: ["hdfs"]
  mem_limit: 1g
  # 이미지 기본 사용자(hadoop)는 도커가 만든 볼륨 디렉터리(root 소유)에 쓸 수 없어 root 로 실행한다
  user: root
  environment:
    TZ: ${TZ:-Asia/Seoul}
    # 이미지의 자바 8(1.8.0_212)은 cgroup v2 메모리 제한을 못 읽어 힙을 호스트 기준(16GB/4)으로 잡는다.
    # 1GiB 제한 안에서 죽지 않게 힙 상한을 명시 (2026-09-03 네임노드 OOM 재발 방지)
    HADOOP_HEAPSIZE_MAX: 512m

services:
  # =========================================================================
  # core : Kafka(KRaft 단일 노드) + Kafka UI                       [서버1]
  # =========================================================================
  kafka:
    <<: *common
    image: apache/kafka:${KAFKA_VERSION:-3.9.1}
    container_name: kafka
    profiles: ["core"]
    mem_limit: 2g
    ports:
      - "29092:29092"            # 호스트(개발 PC)에서 접근하는 리스너
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # --- KRaft (broker + controller 겸용 단일 노드) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 이중 리스너: 컨테이너 내부 kafka:9092 / 호스트 localhost:29092 ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 토픽 기본값: 파티션 3, 단일 브로커라 복제 1 ---
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 docs/contracts/topics.yaml 기준으로 scripts/create-topics.sh 가 만든다. 자동 생성 금지
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # --- 보존: 21일(504h). HDFS 정착 후에만 단축 ---
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 브로커 포트(9092)에 TCP 연결이 되는지만 본다. 이전의 자바 CLI 방식은 10초마다 JVM 을 띄워
      # CPU 가 순간 227%·메모리 +90MiB 튀었다(2026-09-07 실측). 포트 확인은 JVM 없이 끝난다.
      # 포트가 열린 뒤 요청 처리까지 몇 초 차이가 날 수 있지만, 의존 서비스는 모두 자체 재시도가 있다.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-ui:
    <<: *common
    # provectuslabs 는 개발 중단(v0.7.2 가 마지막)이라 최신 Kafka 의 offset 을 잘못 읽는다.
    # 후속 프로젝트 kafbat/kafka-ui 로 교체 (Overview·Messages 의 메시지 수·offset 오독 해결)
    image: ${KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui}:${KAFKA_UI_VERSION:-v1.1.0}
    container_name: kafka-ui
    profiles: ["core"]
    mem_limit: 512m
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KAFKA_CLUSTERS_0_NAME: ddubi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # =========================================================================
  # collect : Python 수집기 9개 (Kafka 발행만 담당)                [서버1]
  #  - 컨테이너 하나가 API 하나. 서비스 이름 = 컨테이너 이름 = collector-<소스명> (2026-09-10 통일)
  #  - 프로필은 collect 하나: 배포 잡이 전부 켠다. 키가 비어 있으면 그 수집기만 "키 없음" 으로 재시작하므로
  #    켜기 전에 서버 .env 의 "수집기 전용" 절에 키를 채운다 (docs/data-collection-guide.md)
  # =========================================================================
  collector-weather:
    <<: *collector
    container_name: collector-weather
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: weather

  collector-bus-arrival:
    <<: *collector
    container_name: collector-bus-arrival
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: bus_arrival

  collector-bus-location:
    <<: *collector
    container_name: collector-bus-location
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: bus_location

  collector-subway-arrival:
    <<: *collector
    container_name: collector-subway-arrival
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: subway_arrival

  collector-subway-location:
    <<: *collector
    container_name: collector-subway-location
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: subway_location

  collector-subway-alert:
    <<: *collector
    container_name: collector-subway-alert
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: subway_alert

  collector-city-realtime:
    <<: *collector
    container_name: collector-city-realtime
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: city_realtime

  collector-traffic-incident:
    <<: *collector
    container_name: collector-traffic-incident
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: traffic_incident

  collector-topis-notice:
    <<: *collector
    container_name: collector-topis-notice
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: topis_notice
      TOPIS_NOTICE_DEDUP_PATH: /app/data/topis_notice_dedup.sqlite3

  # =========================================================================
  # data : MySQL, Redis                                             [서버2]
  #  - 주 DB 는 MySQL. 공간 연산은 DB 에서 하지 않고 수집·전처리 단계에서 segment_id 로 변환한다.
  #  - 3306 은 외부 공개 금지. 호스트 포트는 127.0.0.1 에만 묶는다 (개발 도구 접속용). Backend 는 mysql:3306 으로 붙는다
  # =========================================================================
  mysql:
    <<: *common
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql
    profiles: ["data"]
    # 2026-09-18 진단: 사용량 880MB/1GiB(86%)로 여유가 144MB뿐이라 2026-09-17 23:42 커널이
    # mysqld 를 메모리 초과로 종료했다. 호스트 여유가 10.9GB 라 제한만 올린다.
    mem_limit: 2g
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      # 버퍼 풀은 그대로 둔다. 16384쪽 중 15365쪽(94%)이 차 있어 줄이면 조회가 더 느려진다.
      - --innodb-buffer-pool-size=256M
      # 최대 연결은 실제 최대 사용 13(앱 연결 풀 10 + 관리·스케줄러)에 맞춘다.
      # 최악의 경우 연결별 버퍼가 약 400MB에서 80MB 로 줄어든다.
      - --max-connections=40
      # 로그 버퍼 기본 64MiB 는 이 쓰기량에 과하다. 48MiB 를 고정 확보에서 되돌린다.
      - --innodb-log-buffer-size=16M
      - --slow-query-log=ON
      - --long-query-time=1
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      # 비밀번호 두 개는 필수 변수다. .env 에 없거나 비어 있으면 compose 가 여기서 멈춰 약한 값으로 DB 가 뜨는 일을 막는다(2026-09-18).
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?.env 에 MYSQL_PASSWORD 를 설정하세요}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 초기화 중에는 소켓 전용 임시 서버가 먼저 뜨므로 TCP(127.0.0.1)로 확인해야 거짓 healthy 가 없다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *common
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: redis
    profiles: ["data"]
    mem_limit: 512m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      # 필수 변수다. 비어 있으면 redis 가 비밀번호 없이 뜨므로 compose 가 여기서 멈춘다(2026-09-18).
      - "${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 설정하세요}"
      - --maxmemory
      - 384mb
      # 메모리가 차면 TTL 이 있는 키 중 만료가 가까운 것부터 지운다 (volatile-ttl).
      # 캐시(weather:latest 2h, route:candidates 10m)가 먼저 나가고 상태 키(auth:refresh 14d, idem 24h)는 마지막까지 남는다.
      # TTL 없는 키는 절대 퇴출되지 않으므로 docs/contracts/redis-keys.yaml 에 명시된 것만 TTL 없이 넣는다 (2026-09-03 점검 결정)
      - --maxmemory-policy
      - volatile-ttl
      - --appendonly
      - "yes"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  # =========================================================================
  # serving : Backend(Spring) + Nginx                               [서버2]
  #  - data 프로필과 함께 띄운다 (mysql·redis 필요): --profile data --profile serving
  #  - backend 는 첫 기동 때 Flyway 마이그레이션이 스키마를 만든다 (테이블 수동 생성 불필요)
  #  - 외부 공개는 nginx 의 80/443 뿐. backend 는 호스트 포트를 열지 않는다
  #  - JWT_SECRET 이 비어 있으면 backend 가 기동을 거부한다 (.env 에 반드시 설정)
  # =========================================================================
  ml-serving:
    <<: *common
    build:
      context: ../ml-serving
      dockerfile: Dockerfile
    image: ddubi/ml-serving:${APP_VERSION:-0.1.0}
    container_name: ml-serving
    profiles: ["serving"]
    mem_limit: 4g
    environment:
      TZ: ${TZ:-Asia/Seoul}
      ML_BUNDLE_DIR: /models/v12
      ML_MAX_WAITING_REQUESTS: ${ML_MAX_WAITING_REQUESTS:-4}
      # 대기 상한 2초. 5초였을 때는 백엔드(호출 제한 5초)가 먼저 끊어 양쪽 모두 헛수고였다(2026-09-18).
      # 밀린 요청은 빨리 MODEL_BUSY 로 돌려주고 호출자가 남은 예산을 과거 평균 계산에 쓰게 한다.
      ML_QUEUE_WAIT_SECONDS: ${ML_QUEUE_WAIT_SECONDS:-2}
      ML_REFERENCE_CACHE_MIB: ${ML_REFERENCE_CACHE_MIB:-256}
      # TOPIS 정보는 소요시간 모델 입력이 아니라 경로 상태/설명용 최신 Snapshot으로 유지한다.
      ML_REDIS_LATEST_FEATURES_ENABLED: ${ML_REDIS_LATEST_FEATURES_ENABLED:-true}
      ROAD_PROVISIONAL_MAPPING_ENABLED: ${ROAD_PROVISIONAL_MAPPING_ENABLED:-true}
      ML_BUS_CROSSWALK_SHA256: ${ML_BUS_CROSSWALK_SHA256:-8014da5e1453d426789fa396622a0f0e4069ac484db76860348af517adc1f246}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_REDIS_TIMEOUT_SECONDS: ${ML_REDIS_TIMEOUT_SECONDS:-1.5}
      ML_ONLINE_FEATURE_TTL_SECONDS: ${ML_ONLINE_FEATURE_TTL_SECONDS:-900}
    volumes:
      - ${ML_BUNDLE_DIR:-../artifacts/ml-serving/20260908-v12}:/models/v12:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s

  # 새 전체 돌발 스냅샷을 15초 간격으로 확인하고 해당 버스 구간 CURRENT 특성을 갱신한다.
  ml-incident-feature-refresh:
    <<: *common
    build:
      context: ../ml-serving
      dockerfile: Dockerfile
    image: ddubi/ml-serving:${APP_VERSION:-0.1.0}
    container_name: ml-incident-feature-refresh
    # Redis가 있는 서비스 서버에서만 실행한다. Spark Silver와 프로필을 분리해
    # 두 서버가 서로의 작업까지 중복 실행하지 않게 한다.
    profiles: ["road-feature"]
    mem_limit: 512m
    command: ["python", "incident_feature_refresh.py"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_BUS_CROSSWALK_SHA256: ${ML_BUS_CROSSWALK_SHA256:-8014da5e1453d426789fa396622a0f0e4069ac484db76860348af517adc1f246}
      ML_INCIDENT_MASTER_VERSION: ${ML_INCIDENT_MASTER_VERSION:-METRO-BUS-20260917-SEOUL-0902}
      ML_INCIDENT_REFRESH_POLL_SECONDS: ${ML_INCIDENT_REFRESH_POLL_SECONDS:-15}
      ROAD_PROVISIONAL_MAPPING_ENABLED: ${ROAD_PROVISIONAL_MAPPING_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
        required: false

  backend:
    <<: *common
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ddubi/backend:${APP_VERSION:-0.1.0}
    container_name: backend
    profiles: ["serving"]
    # 2026-09-21 1g → 1.5g. 힙은 아래 JAVA_OPTS 로 512m 에 고정돼 있는데 컨테이너 실사용은 710~917MiB 사이를
    # 오르내렸다(9/21 실측, 봉우리가 상한의 90%). 늘어난 몫은 힙 밖(메타스페이스·스레드·GC 관리표·네이티브)이라
    # 컨테이너 상한만 올린다. 힙을 같이 키우면 힙 밖 여유가 도로 줄어든다. 커널이 상한에서 죽이면 자바 로그 없이
    # exit 137 로 끝나므로(9/17 MySQL 사례) 봉우리 여유를 600MB 로 둔다. 서버2 호스트 여유는 11GB.
    mem_limit: 1.5g
    # 메일·FCM 자격증명만 이 파일에서 온다. 배포 잡(.gitlab-ci.yml deploy-server2)이
    # GitLab CI/CD 변수를 읽어 서버에 만들어 준다.
    #
    # 소셜 키와 나뉘어 있는 이유: 소셜 키는 서버 .env 에 이미 있고 PM 이 관리한다.
    # 같은 이름을 environment: 에도 두면 안 된다 — environment 가 env_file 보다
    # 우선이라, .env 에 값이 없을 때 빈 문자열이 이 파일 값을 덮어쓴다.
    #
    # required: false — 파일이 없어도 기동은 된다. 그때는 메일·푸시가 로그로만 남는다.
    env_file:
      - path: .env.backend
        required: false
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BACKEND_PORT: 8080
      # 같은 도커 네트워크라 서비스 이름으로 접속한다 (서버 IP 불필요)
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # 최신 추천 카드 문장화. 계산 자체는 이 기능과 무관하며 GMS 장애 시 템플릿으로 fallback한다.
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/}
      GMS_RECOMMENDATION_MODEL: ${GMS_RECOMMENDATION_MODEL:-gpt-5.4-nano}
      DDUBI_RECOMMENDATION_GUIDE_ENABLED: ${DDUBI_RECOMMENDATION_GUIDE_ENABLED:-true}
      # 소셜 로그인 — 서버의 infra/.env 에서 온다 (PM 이 관리).
      # 값이 없으면 해당 provider 로그인만 실패하고 기동은 된다.
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 서버1(Spark) 이 /internal/baselines 를 부를 때 쓰는 키.
      # 서버1·서버2 .env 에 같은 값이 있어야 한다 (2026-09-07 인프라 확인).
      # 비어 있으면 backend 가 /internal 을 503 으로 닫는다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # 개발용 테스트 알림 발송(POST /api/v1/dev/notifications/test). 프론트 연동 확인용이다.
      # 기본 false — 켜면 로그인한 본인에게 알림을 임의로 만들 수 있다. 발표 전에 되돌린다.
      DDUBI_DEV_ENDPOINTS_ENABLED: ${DDUBI_DEV_ENDPOINTS_ENABLED:-false}
      # 평가 결과로 자동 FCM 발송. .env 에 값이 있어도 여기서 넘기지 않으면 컨테이너에
      # 닿지 않아 backend 가 기본값(false)을 쓴다 — 2026-09-18 알림이 0건이던 원인이다.
      #
      # 기본 false 를 유지한다. 지금 나가는 숫자는 미승인 모델이 계산한 값이라
      # (production_ready=false) 켜면 검증 안 된 값으로 사용자 폰이 울린다.
      # 연동 확인 때만 켜고 발표 전에 되돌린다.
      DDUBI_AUTO_NOTIFY_ENABLED: ${DDUBI_AUTO_NOTIFY_ENABLED:-false}
      # 미승인 모델 결과로도 알림을 보낸다(본문에 검증용 표시). 승인 게이트는 그대로 둔다.
      DDUBI_SHADOW_PREVIEW_NOTIFY_ENABLED: ${DDUBI_SHADOW_PREVIEW_NOTIFY_ENABLED:-false}
      # 아침 브리핑 스케줄러. 끄면 스케줄러 빈 자체가 만들어지지 않는다.
      DDUBI_BRIEFING_ENABLED: ${DDUBI_BRIEFING_ENABLED:-true}
      DDUBI_TRANSIT_MASTER_IMPORT_ENABLED: ${DDUBI_TRANSIT_MASTER_IMPORT_ENABLED:-false}
      DDUBI_TRANSIT_MASTER_DATA_VERSION: ${DDUBI_TRANSIT_MASTER_DATA_VERSION:-}
      DDUBI_TRANSIT_MASTER_BUS_WORKBOOK: ${DDUBI_TRANSIT_MASTER_BUS_WORKBOOK:-}
      DDUBI_TRANSIT_MASTER_SUBWAY_TIMETABLE: ${DDUBI_TRANSIT_MASTER_SUBWAY_TIMETABLE:-}
      # 평가기는 importer CSV가 아닌 SubwayTimetable.Data JSON을 읽는다.
      DDUBI_SUBWAY_TIMING_TIMETABLE_PATH: ${DDUBI_SUBWAY_TIMING_TIMETABLE_PATH:-}
      # 데이터 담당의 분해/대응 검증 전에는 true로 바꾸지 않는다.
      DDUBI_SUBWAY_TIMING_DECOMPOSITION_VERIFIED: ${DDUBI_SUBWAY_TIMING_DECOMPOSITION_VERIFIED:-false}
      DDUBI_BUS_WAITING_DECOMPOSITION_VERIFIED: ${DDUBI_BUS_WAITING_DECOMPOSITION_VERIFIED:-false}
      # 후보 끝점 도보 보강. 키 권한/좌표/비용 검증 실패 시 원본 시간과 실패 사유를 유지한다.
      DDUBI_WALKING_ENABLED: ${DDUBI_WALKING_ENABLED:-true}
      DDUBI_WALKING_PROVIDER_ENDPOINTS: ${DDUBI_WALKING_PROVIDER_ENDPOINTS:-true}
      DDUBI_WALKING_ENDPOINT_MAX_METERS: ${DDUBI_WALKING_ENDPOINT_MAX_METERS:-0}
      DDUBI_WALKING_MASTER_COORDINATE_PATH: ${DDUBI_WALKING_MASTER_COORDINATE_PATH:-}
      # 검토 참고자료: 적재 완료와 검증 후에만 버전을 명시한다. 운영 추천 승인 플래그가 아니다.
      DDUBI_BUS_REFERENCE_DATA_VERSION: ${DDUBI_BUS_REFERENCE_DATA_VERSION:-}
      DDUBI_BUS_REFERENCE_FALLBACK_ENABLED: ${DDUBI_BUS_REFERENCE_FALLBACK_ENABLED:-false}
      DDUBI_BUS_REFERENCE_FALLBACK_EXPECTED_ROWS: ${DDUBI_BUS_REFERENCE_FALLBACK_EXPECTED_ROWS:-0}
      DDUBI_BUS_REFERENCE_FALLBACK_EXPECTED_CHUNKS: ${DDUBI_BUS_REFERENCE_FALLBACK_EXPECTED_CHUNKS:-0}
      DDUBI_BUS_REFERENCE_FALLBACK_MAX_AGE_DAYS: ${DDUBI_BUS_REFERENCE_FALLBACK_MAX_AGE_DAYS:-90}
      DDUBI_BUS_REFERENCE_FALLBACK_MIN_SAMPLES: ${DDUBI_BUS_REFERENCE_FALLBACK_MIN_SAMPLES:-3}
      DDUBI_BUS_REFERENCE_FALLBACK_MIN_DATES: ${DDUBI_BUS_REFERENCE_FALLBACK_MIN_DATES:-3}
      DDUBI_BUS_REFERENCE_FALLBACK_MAX_FUTURE_DAYS: ${DDUBI_BUS_REFERENCE_FALLBACK_MAX_FUTURE_DAYS:-7}
      DDUBI_BUS_REFERENCE_FALLBACK_SAMPLE_KIND: ${DDUBI_BUS_REFERENCE_FALLBACK_SAMPLE_KIND:-HOURLY_SOURCE_MEAN}
      # 아래 패키지는 현재 시간표/확정 통제가 아니다. 기존 읽기 전용 transit-master 마운트 내 경로를 사용한다.
      DDUBI_REFERENCE_PACKAGES_SUBWAY_PATH: ${DDUBI_REFERENCE_PACKAGES_SUBWAY_PATH:-}
      DDUBI_REFERENCE_PACKAGES_SUBWAY_SHA256: ${DDUBI_REFERENCE_PACKAGES_SUBWAY_SHA256:-}
      DDUBI_REFERENCE_PACKAGES_ROAD_PATH: ${DDUBI_REFERENCE_PACKAGES_ROAD_PATH:-}
      DDUBI_REFERENCE_PACKAGES_ROAD_SHA256: ${DDUBI_REFERENCE_PACKAGES_ROAD_SHA256:-}
      DDUBI_ROAD_PROVISIONAL_MAPPING_ENABLED: ${ROAD_PROVISIONAL_MAPPING_ENABLED:-true}
      DDUBI_TRANSIT_MASTER_SUBWAY_REALTIME_STATIONS: ${DDUBI_TRANSIT_MASTER_SUBWAY_REALTIME_STATIONS:-}
      DDUBI_TRANSIT_MASTER_ALIASES: ${DDUBI_TRANSIT_MASTER_ALIASES:-}
      # 수도권 버스 마스터(V4) 관리 적재. 일반 기동은 false. 적재는 backend 팀과 함께 플래그를 켜 한 번 재기동 → 다시 false
      DDUBI_METROPOLITAN_BUS_IMPORT_ENABLED: ${DDUBI_METROPOLITAN_BUS_IMPORT_ENABLED:-false}
      DDUBI_METROPOLITAN_BUS_ARTIFACT: ${DDUBI_METROPOLITAN_BUS_ARTIFACT:-/opt/ddubi/transit-master/bus/metropolitan-bus-v6.json.gz}
      DDUBI_TRANSIT_MAPPING_SUBWAY_MASTER_RESOURCE: ${DDUBI_TRANSIT_MAPPING_SUBWAY_MASTER_RESOURCE:-}
      DDUBI_METROPOLITAN_BUS_SHA256: ${DDUBI_METROPOLITAN_BUS_SHA256:-6999b0e67eb1af391de563291ce9cf4251b5ec271307e3f24de55d22d17318e2}   # metropolitan-bus-v6.json.manifest.json 의 sha256
      DDUBI_RECOMMENDATION_ML_PREVIEW_BASE_URL: ${DDUBI_RECOMMENDATION_ML_PREVIEW_BASE_URL:-http://ml-serving:8000}
      # ML 호출 한 건의 제한. 실측 단독 응답이 약 4초라 5초는 여유가 없었다. 상한은 코드에서 10초로 막는다.
      # 이 값은 한 번의 호출에만 적용되고, 평가 전체 예산(첫 계산 30초·수동 10초)을 넘기지 않도록
      # 남은 시간이 부족하면 호출을 시작하지 않는다.
      DDUBI_RECOMMENDATION_ML_PREVIEW_TIMEOUT_MS: ${DDUBI_RECOMMENDATION_ML_PREVIEW_TIMEOUT_MS:-7000}
      # 버스 ML 적용 모드. SHADOW=숫자만 기록(기본, 시간 계산에 쓰지 않음) / TEST_APPLY=테스트 환경에서만 시험 적용
      # / PRODUCTION=운영 계약(production_ready·training_ids_verified·feature_version·features_as_of·valid_until·input_digest)을
      # 모두 만족한 응답만 적용. 어느 모드도 productionReady 를 true 로 바꾸지 않는다. 되돌리기는 이 값만 SHADOW 로.
      DDUBI_RECOMMENDATION_ML_APPLY_MODE: ${DDUBI_RECOMMENDATION_ML_APPLY_MODE:-SHADOW}
      # TEST_APPLY 는 이 값이 true 일 때만 기동한다. 실수로 켜지는 것을 막고, 의도적으로 켤 때는 두 값을 같이 지정한다.
      # v12 로 실제 통합 경로를 검증하는 동안 서버2에서 true 로 둔다. 문제가 보이면 적용 모드를 SHADOW 로 되돌린다.
      DDUBI_RECOMMENDATION_ML_TEST_APPLY_ALLOWED: ${DDUBI_RECOMMENDATION_ML_TEST_APPLY_ALLOWED:-false}
      # 한 평가 예산 중 ML 호출에 쓰는 비율(0~1). 나머지는 과거 평균·시간표 계산에 남긴다.
      DDUBI_RECOMMENDATION_ML_BUDGET_SHARE: ${DDUBI_RECOMMENDATION_ML_BUDGET_SHARE:-0.6}
      # 평가 예산(밀리초). 첫 계산/자동 갱신/사용자 수동 다시 계산을 따로 둔다. 앱 안내 문구(30초·10초)와 맞춘다.
      DDUBI_RECOMMENDATION_BUDGET_INITIAL_MILLIS: ${DDUBI_RECOMMENDATION_BUDGET_INITIAL_MILLIS:-30000}
      DDUBI_RECOMMENDATION_BUDGET_AUTO_REFRESH_MILLIS: ${DDUBI_RECOMMENDATION_BUDGET_AUTO_REFRESH_MILLIS:-15000}
      DDUBI_RECOMMENDATION_BUDGET_MANUAL_REFRESH_MILLIS: ${DDUBI_RECOMMENDATION_BUDGET_MANUAL_REFRESH_MILLIS:-10000}
      JAVA_OPTS: -Xms256m -Xmx512m
    volumes:
      # 기본값을 저장소의 backend/transit-master 로(9/11). 이전 기본값 ./transit-master 는 서버에 빈 폴더였다.
      # 지하철 시간표 CSV 등 저장소 밖 파일을 쓰려면 .env 의 TRANSIT_MASTER_DATA_DIR 로 다른 폴더를 지정
      - ${TRANSIT_MASTER_DATA_DIR:-../backend/transit-master}:/opt/ddubi/transit-master:ro
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      # ML 은 보조 축(실패 시 backend 가 카카오 값으로 fallback). healthy 를 기다리게 두면 ml-serving 이미지 실패·
      # 모델 로드 지연이 곧 backend 다운이 된다 (9/14 15:19~15:26 사용자 API 7분 30초 불가). 기동만 확인하고 기다리지 않는다
      ml-serving:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s   # 첫 기동은 Flyway 마이그레이션 때문에 오래 걸릴 수 있다

  nginx:
    <<: *common
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: nginx
    profiles: ["serving"]
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # templates/*.template 의 ${변수} 가 기동 시 치환된다 (envsubst)
      SERVER1_PRIVATE_IP: ${SERVER1_PRIVATE_IP:-127.0.0.1}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - certbot-certs:/etc/letsencrypt:ro      # certbot 이 발급한 인증서를 읽는다
      - certbot-webroot:/var/www/certbot:ro    # LE 도메인 검증 파일 서빙
    depends_on:
      backend:
        condition: service_healthy
        required: false

  # 인증서 발급·자동 갱신 (Let's Encrypt). 12시간마다 깨어나 만료 30일 전이면 갱신한다.
  # 최초 발급은 수동 1회: infra/README.md 의 HTTPS 절 참고 (nginx 중지 후 standalone 발급)
  # 주의: 인증서가 없는 로컬에서는 nginx(443 설정)가 뜨지 못한다 — 로컬 개발은 backend 만 띄우고 8080 직접 호출
  certbot:
    <<: *common
    image: certbot/certbot:${CERTBOT_VERSION:-v2.11.0}
    container_name: certbot
    profiles: ["serving"]
    mem_limit: 128m
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done'
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  # =========================================================================
  # spark : Master + Worker x2 (PySpark 커스텀 이미지)              [서버1]
  #  - 체크포인트/이벤트로그 위치는 SPARK_CHECKPOINT_DIR / SPARK_EVENTLOG_DIR 환경변수로 주입.
  #    2단계: /opt/ddubi/checkpoints (로컬 볼륨) → 3단계: hdfs://hdfs-namenode:9000/ddubi/checkpoints
  # =========================================================================
  spark-master:
    <<: *common
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
      args:
        SPARK_IMAGE: apache/spark:${SPARK_VERSION:-3.5.3-python3}
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-master
    profiles: ["spark", "experiment"]
    mem_limit: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "7077:7077"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HDFS_NAMENODE_URI: ${HDFS_NAMENODE_URI}
    volumes: *spark-volumes

  spark-worker-1:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-1
    profiles: ["spark", "experiment"]
    # 워커 컨테이너의 실제 상한. Spark 장부(SPARK_WORKER_MEMORY 2560m)는 executor 의 힙만 세지만, 커널은 힙 밖
    # 부대비용(스레드·GC 관리표·네트워크 버퍼, executor 당 약 400MB)과 워커 프로세스 자체(약 340MB)까지 센다.
    # 계산: 칸 3개 × (힙 768m + 부대 약 400m) + 워커 340m ≈ 3.8GB. 그래서 4g. 3g 였을 때 2026-09-22 17:34 버스 유입
    # 순간 worker-2 안의 executor 3개 합이 3GB 를 넘어 realtime executor 가 exit 137 로 죽었다(자동 재기동, 서비스 2분 공백).
    # 칸 수(SPARK_WORKER_CORES)나 executor 힙을 올리면 이 값도 같은 식으로 다시 센다.
    mem_limit: 4g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  spark-worker-2:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-2
    profiles: ["spark"]
    # 워커 컨테이너의 실제 상한. Spark 장부(SPARK_WORKER_MEMORY 2560m)는 executor 의 힙만 세지만, 커널은 힙 밖
    # 부대비용(스레드·GC 관리표·네트워크 버퍼, executor 당 약 400MB)과 워커 프로세스 자체(약 340MB)까지 센다.
    # 계산: 칸 3개 × (힙 768m + 부대 약 400m) + 워커 340m ≈ 3.8GB. 그래서 4g. 3g 였을 때 2026-09-22 17:34 버스 유입
    # 순간 worker-2 안의 executor 3개 합이 3GB 를 넘어 realtime executor 가 exit 137 로 죽었다(자동 재기동, 서비스 2분 공백).
    # 칸 수(SPARK_WORKER_CORES)나 executor 힙을 올리면 이 값도 같은 식으로 다시 센다.
    mem_limit: 4g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  # 부하 실험에서만 켜는 세 번째 worker. 기본 spark 프로필에는 포함하지 않는다.
  spark-worker-3:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-3
    profiles: ["experiment"]
    # 워커 컨테이너의 실제 상한. Spark 장부(SPARK_WORKER_MEMORY 2560m)는 executor 의 힙만 세지만, 커널은 힙 밖
    # 부대비용(스레드·GC 관리표·네트워크 버퍼, executor 당 약 400MB)과 워커 프로세스 자체(약 340MB)까지 센다.
    # 계산: 칸 3개 × (힙 768m + 부대 약 400m) + 워커 340m ≈ 3.8GB. 그래서 4g. 3g 였을 때 2026-09-22 17:34 버스 유입
    # 순간 worker-2 안의 executor 3개 합이 3GB 를 넘어 realtime executor 가 exit 137 로 죽었다(자동 재기동, 서비스 2분 공백).
    # 칸 수(SPARK_WORKER_CORES)나 executor 힙을 올리면 이 값도 같은 식으로 다시 센다.
    mem_limit: 4g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  # 스트리밍 잡 드라이버 (client 모드). 잡 하나당 서비스 하나. 실행: sparkjobs/submit.sh
  spark-streaming-weather:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-weather
    profiles: ["spark"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/weather_latest.py"]
    ports:
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      # 10분에 14건 처리하는 잡. executor 를 768m·코어 1 로 낮춰 worker 에 실시간·배치 잡 자리를 남긴다 (2026-09-07)
      # weather 는 계산을 드라이버에서 하므로 executor 힙 실사용이 약 180MB 다. 768m 이면 자바가 힙을 그만큼 붙들어
      # RSS 가 650MB 를 넘으므로 512m 으로 묶는다(2026-09-23). realtime 은 실제로 힙을 쓰니 768m 을 유지한다.
      SPARK_EXECUTOR_MEMORY: ${STREAMING_EXECUTOR_MEMORY:-512m}
      SPARK_CORES_MAX: ${STREAMING_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 같은 표준 DataFrame을 Redis와 HDFS에 쓰되, Silver는 서버 .env에 경로가 있을 때만 켠다.
      # HDFS Silver가 실패해도 서비스가 읽는 Redis 스트림은 계속 실행한다.
      SILVER_OUTPUT_URI: ${SILVER_OUTPUT_URI:-}
      WEATHER_REQUIRE_SILVER: ${WEATHER_REQUIRE_SILVER:-false}
      WEATHER_SILVER_TRIGGER: ${WEATHER_SILVER_TRIGGER:-10 minutes}
      WEATHER_SILVER_WATERMARK: ${WEATHER_SILVER_WATERMARK:-2 days}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 비기상 실시간 이벤트(버스·지하철·도로·도시·S-DoT) 최신값 Redis 적재 잡.
  spark-streaming-realtime:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-realtime
    profiles: ["spark"]
    mem_limit: ${REALTIME_MEM_LIMIT:-2560m}   # 드라이버 힙 2g + 파이썬·JVM 오버헤드. 9/11 버스 대응표(인접 구간 10만 행) 조인이 512m 힙에서 OOM 재시작 반복해 상향
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/realtime_latest.py"]
    ports:
      - "${SPARK_REALTIME_DRIVER_UI_PORT:-4042}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      SPARK_JOB_TOPICS: transport.raw,city.raw
      BUS_SILVER_OUTPUT_URI: ${BUS_SILVER_OUTPUT_URI-hdfs://hdfs-namenode:9000/ddubi/silver/bus/realtime-v1}
      # 날씨 잡이 각 워커의 1GiB를 사용하므로 남은 512MiB 안에 executor가 배치되게 한다.
      # 수집기 4개가 켜지면 날씨보다 유입이 많다. 480m 은 Spark 최소치에 가까워 768m 으로, 코어는 1 (2026-09-07)
      SPARK_DRIVER_MEMORY: ${REALTIME_DRIVER_MEMORY:-2g}        # submit.sh 기본 512m 은 대응표 DataFrame 을 못 담는다
      SPARK_EXECUTOR_MEMORY: ${REALTIME_EXECUTOR_MEMORY:-768m}
      SPARK_CORES_MAX: ${REALTIME_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Collector와 Spark가 검증된 동일 artifact/지문을 사용한다. load_crosswalk는 기동 시 cache/count로 한 번 물질화한다.
      BUS_CROSSWALK_PATH: ${SPARK_BUS_CROSSWALK_PATH:-/opt/ddubi/transit-master/bus/metropolitan-bus-v6.crosswalk.json.gz}
      BUS_CROSSWALK_SHA256: ${SPARK_BUS_CROSSWALK_SHA256:-8014da5e1453d426789fa396622a0f0e4069ac484db76860348af517adc1f246}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../backend/transit-master:/opt/ddubi/transit-master:ro   # 버스 대응표 (driver 가 기동 시 한 번 읽음)
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 서울 실시간 도시데이터의 인구·예측·도로 링크를 동일 규칙으로 정규화한다.
  # Redis는 항상 실행하고, CITY_SILVER_OUTPUT_URI를 설정한 서버에서만 HDFS Parquet도 쓴다.
  spark-streaming-city-realtime:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-city-realtime
    profiles: ["spark"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/city_realtime_silver.py"]
    ports:
      - "${SPARK_CITY_DRIVER_UI_PORT:-4047}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      # 배치를 collect() 로 드라이버에 모아 처리하는 구조라 executor 힙은 작아도 된다(2026-09-23, 위 weather 와 같은 이유).
      SPARK_EXECUTOR_MEMORY: ${CITY_STREAMING_EXECUTOR_MEMORY:-512m}
      SPARK_CORES_MAX: ${CITY_STREAMING_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CITY_SILVER_OUTPUT_URI: ${CITY_SILVER_OUTPUT_URI:-}
      CITY_SILVER_FRESHNESS_SECONDS: ${CITY_SILVER_FRESHNESS_SECONDS:-900}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 검증된 실제 구간 통과 이벤트만 원문/offset과 함께 Parquet으로 보존한다.
  # 도착예정값이나 8시간 간격 위치값을 실측으로 변환하는 생산자는 아직 없으므로 별도 프로필로만 실행한다.
  spark-streaming-segment-observations:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-segment-observations
    profiles: ["recommendation-data"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/segment_observations.py"]
    ports:
      - "${SPARK_SEGMENT_OBSERVATIONS_DRIVER_UI_PORT:-4045}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      SPARK_EXECUTOR_MEMORY: ${SEGMENT_OBSERVATIONS_EXECUTOR_MEMORY:-768m}
      SPARK_CORES_MAX: ${SEGMENT_OBSERVATIONS_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SEGMENT_FACTS_PATH: ${SEGMENT_FACTS_PATH:-hdfs://hdfs-namenode:9000/ddubi/silver/segment-observation/v1}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 위 실측과 검증된 registry/baseline을 매분 평가해 Redis 최신값과 Kafka 판정 이력을 함께 발행한다.
  # registry/baseline 경로가 비어 있으면 기동을 거부해 미검증 매핑이나 기준선을 사용하지 않는다.
  spark-streaming-segment-status:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-segment-status
    profiles: ["recommendation-data"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command:
      - sh
      - -c
      - >-
        : "$${SEGMENT_REGISTRY_PATH:?SEGMENT_REGISTRY_PATH가 필요합니다}";
        : "$${SEGMENT_BASELINE_PATH:?SEGMENT_BASELINE_PATH가 필요합니다}";
        exec sh submit.sh streaming/segment_status_live.py
        --input "$${SEGMENT_FACTS_PATH}"
        --registry "$${SEGMENT_REGISTRY_PATH}"
        --baseline "$${SEGMENT_BASELINE_PATH}"
        --output "$${SEGMENT_STATUS_OUTPUT_PATH}"
        --policy-version "$${SEGMENT_STATUS_POLICY_VERSION}"
        --slow-seconds "$${SEGMENT_STATUS_SLOW_SECONDS}"
        --delayed-seconds "$${SEGMENT_STATUS_DELAYED_SECONDS}"
        --min-samples "$${SEGMENT_STATUS_MIN_SAMPLES}"
        --max-age-seconds "$${SEGMENT_STATUS_MAX_AGE_SECONDS}"
        --publish
    ports:
      - "${SPARK_SEGMENT_STATUS_DRIVER_UI_PORT:-4046}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_EXECUTOR_MEMORY: ${SEGMENT_STATUS_EXECUTOR_MEMORY:-768m}
      SPARK_CORES_MAX: ${SEGMENT_STATUS_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SEGMENT_FACTS_PATH: ${SEGMENT_FACTS_PATH:-hdfs://hdfs-namenode:9000/ddubi/silver/segment-observation/v1}
      SEGMENT_REGISTRY_PATH: ${SEGMENT_REGISTRY_PATH:-}
      SEGMENT_BASELINE_PATH: ${SEGMENT_BASELINE_PATH:-}
      SEGMENT_STATUS_OUTPUT_PATH: ${SEGMENT_STATUS_OUTPUT_PATH:-hdfs://hdfs-namenode:9000/ddubi/derived/segment-status/v1}
      SEGMENT_STATUS_POLICY_VERSION: ${SEGMENT_STATUS_POLICY_VERSION:-segment-status-v1}
      SEGMENT_STATUS_SLOW_SECONDS: ${SEGMENT_STATUS_SLOW_SECONDS:-30}
      SEGMENT_STATUS_DELAYED_SECONDS: ${SEGMENT_STATUS_DELAYED_SECONDS:-60}
      SEGMENT_STATUS_MIN_SAMPLES: ${SEGMENT_STATUS_MIN_SAMPLES:-3}
      SEGMENT_STATUS_MAX_AGE_SECONDS: ${SEGMENT_STATUS_MAX_AGE_SECONDS:-300}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # TOPIS 공지를 GMS로 구조화하고 Kakao 좌표를 붙이는 별도 잡.
  # 새 외부 API 기능은 기본 배포에서 분리하고 `--profile topis-ai`로 명시적으로 켠다.
  spark-streaming-topis:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-topis
    profiles: ["topis-ai"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/topis_enriched.py"]
    ports:
      - "${SPARK_TOPIS_DRIVER_UI_PORT:-4043}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      # 공지 구조화는 드라이버에서 GMS·카카오를 부르며 하므로 executor 힙은 작아도 된다(2026-09-23).
      SPARK_EXECUTOR_MEMORY: ${TOPIS_EXECUTOR_MEMORY:-512m}
      SPARK_CORES_MAX: ${TOPIS_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/}
      GMS_MODEL: ${GMS_MODEL:-gpt-4o-mini}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      TOPIS_AI_TIMEOUT_SECONDS: ${TOPIS_AI_TIMEOUT_SECONDS:-30}
      # 비어 있으면 Redis만 실행한다. HDFS 실패도 Redis 스트림을 중단하지 않는다.
      TOPIS_SILVER_OUTPUT_URI: ${TOPIS_SILVER_OUTPUT_URI:-}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # TOPIS 교통 돌발을 공식 링크 마스터와 좌표로 검증하는 Silver 잡.
  # 승인된 링크 artifact가 아직 없으므로 기본 spark 배포와 분리한다.
  spark-streaming-traffic-incident:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-traffic-incident
    profiles: ["road-silver"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/traffic_incident_silver.py"]
    ports:
      - "${SPARK_TRAFFIC_INCIDENT_DRIVER_UI_PORT:-4044}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      SPARK_EXECUTOR_MEMORY: ${TRAFFIC_INCIDENT_EXECUTOR_MEMORY:-768m}
      SPARK_CORES_MAX: ${TRAFFIC_INCIDENT_CORES_MAX:-1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TRAFFIC_INCIDENT_SILVER_OUTPUT_URI: ${TRAFFIC_INCIDENT_SILVER_OUTPUT_URI:-}
      TRAFFIC_LINK_MASTER_PATH: ${TRAFFIC_LINK_MASTER_PATH:-}
      TRAFFIC_LINK_MASTER_SHA256: ${TRAFFIC_LINK_MASTER_SHA256:-}
      ROAD_PROVISIONAL_MAPPING_ENABLED: ${ROAD_PROVISIONAL_MAPPING_ENABLED:-true}
      ROAD_PROVISIONAL_TRAFFIC_LINK_MASTER_VERSION: ${ROAD_PROVISIONAL_TRAFFIC_LINK_MASTER_VERSION:-provisional-accinfo-input-v1}
      TRAFFIC_INCIDENT_AI_ENABLED: ${TRAFFIC_INCIDENT_AI_ENABLED:-false}
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/}
      TRAFFIC_INCIDENT_AI_MODEL: ${TRAFFIC_INCIDENT_AI_MODEL:-gpt-4o-mini}
      TRAFFIC_INCIDENT_AI_CACHE_PATH: /opt/ddubi/checkpoints/incident-ai/cache.sqlite3
      TRAFFIC_INCIDENT_AI_TIMEOUT_SECONDS: ${TRAFFIC_INCIDENT_AI_TIMEOUT_SECONDS:-15}
      TRAFFIC_INCIDENT_AI_MAX_CALLS_PER_BATCH: ${TRAFFIC_INCIDENT_AI_MAX_CALLS_PER_BATCH:-10}
      TRAFFIC_INCIDENT_STALE_SECONDS: ${TRAFFIC_INCIDENT_STALE_SECONDS:-2700}
      TRAFFIC_LINK_COORD_TOLERANCE_METERS: ${TRAFFIC_LINK_COORD_TOLERANCE_METERS:-200}
      TRAFFIC_NEARBY_MAX_METERS: ${TRAFFIC_NEARBY_MAX_METERS:-100}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../backend/transit-master:/opt/ddubi/transit-master:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 부하 실험용 스트리밍 인스턴스 (experiment 프로필). 운영 잡과 같은 코드를 환경변수만 바꿔 띄운다:
  #  - city.replay(재생 토픽)를 읽고 Redis 는 weather:replay:* 에만 써서 운영 키를 건드리지 않는다
  #  - 체크포인트도 별도(weather_replay), 진행률은 Spark UI 의 Input Rows 로 측정한다
  #  - 처리량 상한(maxOffsetsPerTrigger)을 크게 풀어 worker 수 차이가 드러나게 한다
  # 실험 중에는 운영 스트리밍(spark-streaming-weather)을 잠시 멈춰 워커 자원을 전부 넘기는 것을 권장
  spark-streaming-replay:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-replay
    profiles: ["experiment"]
    restart: "no"
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/weather_latest.py"]
    ports:
      - "4041:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_JOB_NAME: weather_replay
      SPARK_JOB_TOPIC: city.replay
      REDIS_KEY_PREFIX: weather:replay
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${EXPERIMENT_MAX_OFFSETS_PER_TRIGGER:-200000}
      SPARK_STARTING_OFFSETS: latest
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_EXECUTOR_MEMORY: ${EXPERIMENT_EXECUTOR_MEMORY:-1g}
      SPARK_CORES_MAX: ${EXPERIMENT_CORES_MAX:-4}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1

  # 배치 잡 실행기 (일회성). 예: docker compose --profile batch run --rm spark-batch sh submit.sh batch/weather_baseline.py --days 28
  spark-batch:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-batch
    profiles: ["batch"]
    restart: "no"
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "-c", "echo 'usage: docker compose --profile batch run --rm spark-batch sh submit.sh batch/<job>.py [args]'"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 버스 구간→날씨 격자 배치가 Collector와 같은 실제 수집 범위를 검사한다.
      WEATHER_GRID_POINTS: ${WEATHER_GRID_POINTS:-}
      BUS_WEATHER_MAPPING_TTL_SECONDS: ${BUS_WEATHER_MAPPING_TTL_SECONDS:-2592000}
      BUS_ROAD_MAPPING_TTL_SECONDS: ${BUS_ROAD_MAPPING_TTL_SECONDS:-2592000}
      BUS_ROAD_PROVISIONAL_MAPPING_TTL_SECONDS: ${BUS_ROAD_PROVISIONAL_MAPPING_TTL_SECONDS:-604800}
      BUS_CITY_MAPPING_TTL_SECONDS: ${BUS_CITY_MAPPING_TTL_SECONDS:-2592000}
      CITY_MAPPING_MAX_DISTANCE_METERS: ${CITY_MAPPING_MAX_DISTANCE_METERS:-300}
      CITY_MAPPING_AMBIGUITY_METERS: ${CITY_MAPPING_AMBIGUITY_METERS:-50}
      BASELINE_INPUT_URI: ${BASELINE_INPUT_URI}
      BASELINE_OUTPUT_URI: ${BASELINE_OUTPUT_URI}
      BASELINE_WINDOW_DAYS: ${BASELINE_WINDOW_DAYS:-28}
      # 기준선 업로드 API (비우면 업로드 생략 — 구간 기준선 배치에서 사용 예정)
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # 정상 축소(노선 폐지 등)를 운영자가 한 번만 허용할 때: 실행 직전 .env 에 넣고 끝나면 지운다 (docs/runbooks/reprocess-from-archive.md)
      BASELINE_ALLOW_SHRINK: ${BASELINE_ALLOW_SHRINK:-}
      BASELINE_SHRINK_REASON: ${BASELINE_SHRINK_REASON:-}
      # 스트리밍 실행기(1g x2)가 워커 메모리(1536m x2)를 먼저 쓰고 있어, 배치는 남는 몫(≈500m) 안에서 돈다.
      # 더 크게 잡으면 자원을 못 받아 무한 대기하고, Spark 최소값(450m) 보다 작으면 시작을 거부한다. 워커 메모리를 늘리면 함께 올린다.
      SPARK_EXECUTOR_MEMORY: ${BATCH_EXECUTOR_MEMORY:-480m}
      SPARK_DRIVER_MEMORY: ${BATCH_DRIVER_MEMORY:-512m}
      SPARK_CORES_MAX: ${BATCH_CORES_MAX:-2}
    volumes:
      - ./spark/conf:/opt/spark/conf:ro
      - ../backend/transit-master:/opt/ddubi/transit-master:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy

  # =========================================================================
  # archive : Kafka -> Parquet 아카이버                            [서버1]
  #  - 2단계: ARCHIVE_URI=file://<ARCHIVE_LOCAL_DIR> 로컬 볼륨 / 3단계: webhdfs://hdfs-namenode:9870/... 로 값만 변경
  #  - 1시간 또는 128MB 단위 병합 (small files 방지). 파일을 쓴 뒤에만 오프셋 커밋
  # =========================================================================
  archiver:
    <<: *common
    build:
      context: ..
      dockerfile: archiver/Dockerfile
    image: ddubi/archiver:${APP_VERSION:-0.1.0}
    container_name: archiver
    profiles: ["archive"]
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Asia/Seoul}
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARCHIVE_TOPICS: ${ARCHIVE_TOPICS:-transport.raw,city.raw,source.poll-status,segment.status}   # topics.yaml 의 archive: true 토픽
      ARCHIVE_LOCAL_DIR: ${ARCHIVE_LOCAL_DIR}
      ARCHIVE_URI: ${ARCHIVE_URI}
      ARCHIVE_HDFS_USER: ${ARCHIVE_HDFS_USER:-hadoop}
      ARCHIVE_FLUSH_MINUTES: ${ARCHIVE_FLUSH_MINUTES:-60}
      ARCHIVE_FLUSH_SECONDS: ${ARCHIVE_FLUSH_SECONDS:-}            # 개발·검증용. 비우면 분 단위 사용
      ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-134217728}
    volumes:
      - archive-data:${ARCHIVE_LOCAL_DIR}
    depends_on:
      kafka:
        condition: service_healthy
        required: false

  # 아카이브 재생기 (일회성, 부하 실험·시연용). archiver 이미지 재사용.
  # 원본 토픽이 아니라 전용 재생 토픽(예: city.replay)으로 발행한다 — 아카이버 재수집 오염 방지.
  # 예: docker compose --profile replay run --rm replay-producer \
  #       python -m replay --source-topic city.raw --target-topic city.replay \
  #       --from-date 2026-08-31 --to-date 2026-09-01 --rate 500 --limit 50000
  replay-producer:
    <<: *common
    build:
      context: ..
      dockerfile: archiver/Dockerfile
    image: ddubi/archiver:${APP_VERSION:-0.1.0}
    container_name: replay-producer
    profiles: ["replay"]
    restart: "no"
    mem_limit: 512m
    command: ["sh", "-c", "echo 'usage: docker compose --profile replay run --rm replay-producer python -m replay --help'"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARCHIVE_URI: ${ARCHIVE_URI}
      ARCHIVE_HDFS_USER: ${ARCHIVE_HDFS_USER:-hadoop}

  # =========================================================================
  # hdfs : NameNode + DataNode1 [서버1], DataNode2 [서버2]
  #  - namenode 는 최초 1회만 포맷하고 이후엔 그대로 기동한다.
  #  - 클라이언트(archiver→WebHDFS 9870, Spark→RPC 9000)는 데이터노드에 호스트명으로 접근한다.
  #    서버 2대로 나눌 때는 상대 서버 데이터노드 이름을 extra_hosts 로 사설 IP 에 매핑해야 한다.
  # =========================================================================
  hdfs-namenode:
    <<: *hdfs
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    command:
      - sh
      - -c
      - |
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          hdfs namenode -format -nonInteractive
        fi
        exec hdfs namenode
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # NameNode RPC
    volumes:
      # HDFS 설정은 단일 파일 마운트를 유지한다 (이미지의 /opt/hadoop/etc/hadoop 에 다른 필수 파일이 많아 디렉터리로 덮을 수 없음).
      # 따라서 *.xml 을 고쳐 배포한 뒤에는 반드시 재생성: up -d --force-recreate hdfs-namenode hdfs-datanode1 (서버2: hdfs-datanode2)
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/hadoop/dfs/name
    healthcheck:
      # 세이프 모드가 풀려 쓰기가 가능해야 healthy (재시작 직후 1~2분은 starting). JMX 를 HTTP 로 읽으므로 JVM 을 띄우지 않는다.
      # 데이터노드에는 헬스체크를 두지 않는다 — 배포 때 네임노드와 함께 재생성되는 위험 범위를 키우지 않기 위해 (2026-09-09)
      test:
        - CMD-SHELL
        - "curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeInfo' | grep -q '\"Safemode\" *: *\"\"'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  hdfs-datanode1:
    <<: *hdfs
    container_name: hdfs-datanode1
    hostname: hdfs-datanode1
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode1-data:/hadoop/dfs/data
    depends_on:
      - hdfs-namenode

  hdfs-datanode2:
    <<: *hdfs
    container_name: hdfs-datanode2
    hostname: hdfs-datanode2
    # 서버2 전용 프로필. 서버1의 hdfs 프로필(namenode+datanode1)에 딸려가지 않게 분리했다.
    # 로컬(한 대)에서 복제 2를 채우려면 --profile hdfs --profile hdfs2 둘 다 켠다
    profiles: ["hdfs2"]
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode2-data:/hadoop/dfs/data
    depends_on:
      hdfs-namenode:
        condition: service_started
        required: false   # hdfs2 단독 기동 시 namenode 정의가 비활성이어도 깨지지 않게

  # 세컨더리 네임노드. 서버2에서 항상 켜 둔다.
  # 네임노드의 메타데이터(어느 블록이 어느 파일인지 적힌 목차)는 서버1 볼륨 한 곳에만 있었다. 이 컨테이너가 한 시간마다
  # 서버1 네임노드에서 목차 파일(fsimage)과 변경 기록(edits)을 받아 하나로 합친 새 목차 파일을 만들고, 자기 볼륨에 두면서
  # 서버1 네임노드에도 돌려준다. 덕분에 서버2에 최대 한 시간 전 목차 사본이 항상 있고, 서버1의 변경 기록도 무한히 자라지 않는다.
  # 통신은 서버2에서 서버1의 9870·9000 포트로만 나간다. 데이터노드2가 이미 쓰는 길이라 방화벽을 바꿀 필요가 없다.
  # 서버1 네임노드가 죽어도 이 컨테이너가 자동으로 이어받지는 않는다. 서버가 두 대뿐이어서 다수결로 진짜를 정하는
  # 자동 이중화는 만들 수 없기 때문이다. 이어받기는 사람이 scripts/failover-namenode.sh 로 한다.
  # 절차는 docs/runbooks/hdfs-namenode-metadata-loss.md 에 있다.
  hdfs-secondarynamenode:
    <<: *hdfs
    container_name: hdfs-secondarynamenode
    hostname: hdfs-secondarynamenode
    profiles: ["hdfs2"]
    command: ["hdfs", "secondarynamenode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namesecondary-data:/hadoop/dfs/namesecondary
    depends_on:
      hdfs-namenode:
        condition: service_started
        required: false

  # 예비 네임노드. 평소에는 꺼져 있고(전용 프로필 hdfs-standby), 서버1 네임노드의 목차를 잃었을 때만 사람이 켠다.
  # 처음 켤 때 자기 이름 폴더가 비어 있으면 세컨더리가 만든 사본을 가져와서 시작한다. 이미 목차가 있으면 그대로 시작한다.
  # 켜기 전에 세컨더리 네임노드를 꼭 멈춰야 한다. 세컨더리가 같은 사본 폴더에 잠금을 잡고 있어서, 켜져 있으면 예비가 그 폴더를
  # 열지 못하고 바로 종료된다. 이 순서를 지켜 주는 것이 scripts/failover-namenode.sh 다.
  hdfs-namenode-standby:
    <<: *hdfs
    container_name: hdfs-namenode-standby
    hostname: hdfs-namenode
    profiles: ["hdfs-standby"]
    command:
      - sh
      - -c
      - |
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          echo "이름 폴더가 비어 있어 세컨더리 사본(/hadoop/dfs/namesecondary)에서 목차를 가져와 시작한다"
          exec hdfs namenode -importCheckpoint
        fi
        exec hdfs namenode
    ports:
      - "9870:9870"   # 서버1 네임노드와 같은 포트를 서버2 호스트에 연다. 데이터노드2는 호스트 IP 로 네임노드를 찾기 때문이다
      - "9000:9000"
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-standby-data:/hadoop/dfs/name
      - hdfs-namesecondary-data:/hadoop/dfs/namesecondary
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeInfo' | grep -q '\"Safemode\" *: *\"\"'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # =========================================================================
  # monitoring : Prometheus / Grafana / kafka-exporter [서버2], node-exporter [양쪽]
  # =========================================================================
  prometheus:
    <<: *common
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/ddubi/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      # 디렉터리 마운트 (단일 파일 마운트는 git pull 교체가 컨테이너에 반영되지 않음). 이미지의 /etc/prometheus 는 그대로 두고 하위 경로에 붙인다
      - ./monitoring/prometheus:/etc/prometheus/ddubi:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.1}
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 필수 변수다. 관리자 비밀번호가 비어 있거나 기본값으로 뜨는 일을 막는다(2026-09-18).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?.env 에 GRAFANA_ADMIN_PASSWORD 를 설정하세요}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 알림 수신처(Mattermost 수신 웹훅, Slack 호환). monitoring/grafana/alerting/contact-points.yaml 이 ${GF_ALERT_WEBHOOK_URL} 로 읽는다.
      # 값은 서버 .env 에만. 비어 있으면(로컬) 무해한 자리표시 주소로 두어 Grafana 기동이 막히지 않게 한다
      GF_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-https://example.invalid/hooks/unset}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION:-v1.8.0}
    container_name: kafka-exporter
    # Kafka 와 같은 서버(서버1)에서 exporters 프로필로 띄운다. Prometheus(서버2)가 9308 을 원격 스크랩
    profiles: ["exporters"]
    mem_limit: 128m
    command:
      - --kafka.server=${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9308:9308"

  node-exporter:
    <<: *common
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    container_name: node-exporter
    profiles: ["monitoring", "exporters"]   # 서버1은 exporters, 서버2는 monitoring 으로 양쪽 다 뜬다
    mem_limit: 128m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

  hdfs-exporter:
    <<: *common
    image: prometheuscommunity/json-exporter:${JSON_EXPORTER_VERSION:-v0.7.0}
    container_name: hdfs-exporter
    # 네임노드 /jmx(JSON) 를 Prometheus 형식으로 바꾼다. 서버1 exporters 프로필. 서버2 Prometheus 가 7979 원격 스크랩
    profiles: ["exporters"]
    mem_limit: 128m
    command:
      - --config.file=/config/hdfs.yml
    volumes:
      - ./monitoring/json-exporter:/config:ro
    ports:
      - "7979:7979"

  # 상태 주소를 대신 찔러 보고 성공 여부를 지표(probe_success 1/0)로 바꿔 주는 도구. 서버2 monitoring 프로필.
  # ml-serving 은 Prometheus 가 읽을 지표 주소가 없고 /health/ready(준비되면 200, 아니면 503)만 있어서 이 도구로 감시한다.
  # 어떤 주소를 어떻게 찌를지는 monitoring/blackbox/blackbox.yml 에, 어떤 주소를 감시할지는 prometheus.yml 의 ml-serving 잡에 있다.
  # 나중에 다른 URL 도 같은 방식으로 붙일 수 있다.
  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION:-v0.25.0}
    container_name: blackbox-exporter
    profiles: ["monitoring"]
    mem_limit: 64m
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./monitoring/blackbox:/config:ro

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.66.0}
    container_name: redis-exporter
    profiles: ["monitoring"]
    mem_limit: 128m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 포트 비공개: prometheus 와 같은 도커 네트워크에서 redis-exporter:9121 로 읽는다

  mysqld-exporter:
    <<: *common
    image: prom/mysqld-exporter:${MYSQLD_EXPORTER_VERSION:-v0.16.0}
    container_name: mysqld-exporter
    profiles: ["monitoring"]
    mem_limit: 128m
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-}   # 서버2 .env 에만 있음. 빈 기본값을 두어 서버1에서 compose 명령 시 경고가 나지 않게

networks:
  ddubi-network:
    name: ddubi-network

volumes:
  collector-budget:
  certbot-certs:
  certbot-webroot:
  mysql-data:
  redis-data:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode1-data:
  hdfs-datanode2-data:
  hdfs-namesecondary-data:       # 서버2. 세컨더리 네임노드가 매시간 두는 목차 사본이 들어간다
  hdfs-namenode-standby-data:    # 서버2. 예비 네임노드의 이름 폴더. 이어받기를 할 때만 채워진다
  spark-checkpoints:
  spark-events:
  spark-ivy:
  archive-data:
  prometheus-data:
  grafana-data:
