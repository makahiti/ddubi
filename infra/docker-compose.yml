name: ddubi

# ---------------------------------------------------------------------------
# 공통 설정 (YAML anchor)
#  - 로그 로테이션: 10MB x 3 파일
#  - 모든 서비스는 ddubi-network 하나에 붙고 mem_limit 을 가진다
#  - 프로필: core / collect / data / spark / archive / hdfs / monitoring
#    (예) docker compose --profile core up -d
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks:
    - ddubi-network

# 수집기 5개가 공유하는 정의. 소스별로 COLLECTOR_SOURCE 만 다르다.
x-collector: &collector
  <<: *common
  build:
    context: ..
    dockerfile: collector/Dockerfile
  image: ddubi/collector:${APP_VERSION:-0.1.0}
  profiles: ["collect"]
  mem_limit: 256m
  depends_on:
    kafka:
      condition: service_healthy
      required: false   # core 프로필 없이 collect 만 켤 때도 정의가 깨지지 않게

x-collector-env: &collector-env
  TZ: ${TZ:-Asia/Seoul}
  APP_ENV: ${APP_ENV:-local}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-}   # 비우면 소스별 기본 주기
  WEATHER_GRID_POINTS: ${WEATHER_GRID_POINTS:-}                 # 비우면 서울 25개 구
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
  SEOUL_API_KEY: ${SEOUL_API_KEY:-}
  DATA_GO_KR_API_KEY: ${DATA_GO_KR_API_KEY:-}
  KMA_API_KEY: ${KMA_API_KEY:-}

# Spark 3개 노드가 공유하는 마운트. 설정은 infra/spark/spark-defaults.conf 마운트.
# 로컬 볼륨 경로는 고정. SPARK_CHECKPOINT_DIR/SPARK_EVENTLOG_DIR 는 이 경로(2단계) 또는 hdfs://...(3단계) 를 가리킨다.
x-spark-volumes: &spark-volumes
  - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  - ../sparkjobs:/opt/ddubi/sparkjobs
  - spark-checkpoints:/opt/ddubi/checkpoints
  - spark-events:/opt/ddubi/spark-events

# HDFS 3개 노드가 공유하는 정의. 설정은 infra/hdfs/*.xml 마운트.
x-hdfs: &hdfs
  <<: *common
  image: apache/hadoop:${HADOOP_VERSION:-3.4.1}
  profiles: ["hdfs"]
  mem_limit: 1g
  # 이미지 기본 사용자(hadoop)는 도커가 만든 볼륨 디렉터리(root 소유)에 쓸 수 없어 root 로 실행한다
  user: root
  environment:
    TZ: ${TZ:-Asia/Seoul}

services:
  # =========================================================================
  # core : Kafka(KRaft 단일 노드) + Kafka UI                       [서버1]
  # =========================================================================
  kafka:
    <<: *common
    image: apache/kafka:${KAFKA_VERSION:-3.9.1}
    container_name: kafka
    profiles: ["core"]
    mem_limit: 2g
    ports:
      - "29092:29092"            # 호스트(개발 PC)에서 접근하는 리스너
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # --- KRaft (broker + controller 겸용 단일 노드) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 이중 리스너: 컨테이너 내부 kafka:9092 / 호스트 localhost:29092 ---
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- 토픽 기본값: 파티션 3, 단일 브로커라 복제 1 ---
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 docs/contracts/topics.yaml 기준으로 scripts/create-topics.sh 가 만든다. 자동 생성 금지
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # --- 보존: 21일(504h). HDFS 정착 후에만 단축 ---
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    <<: *common
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-v0.7.2}
    container_name: kafka-ui
    profiles: ["core"]
    mem_limit: 512m
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KAFKA_CLUSTERS_0_NAME: ddubi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # =========================================================================
  # collect : Python 수집기 x5 (Kafka 발행만 담당)                [서버1]
  # =========================================================================
  collector-bus:
    <<: *collector
    container_name: collector-bus
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: bus

  collector-subway:
    <<: *collector
    container_name: collector-subway
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: subway

  collector-traffic:
    <<: *collector
    container_name: collector-traffic
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: traffic

  collector-weather:
    <<: *collector
    container_name: collector-weather
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: weather

  collector-event:
    <<: *collector
    container_name: collector-event
    environment:
      <<: *collector-env
      COLLECTOR_SOURCE: event

  # =========================================================================
  # data : MySQL, Redis                                             [서버2]
  #  - 주 DB 는 MySQL. 공간 연산은 DB 에서 하지 않고 수집·전처리 단계에서 segment_id 로 변환한다.
  #  - 3306 은 외부 공개 금지. 호스트 포트는 127.0.0.1 에만 묶는다 (개발 도구 접속용). Backend 는 mysql:3306 으로 붙는다
  # =========================================================================
  mysql:
    <<: *common
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: mysql
    profiles: ["data"]
    mem_limit: 1g
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --slow-query-log=ON
      - --long-query-time=1
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 초기화 중에는 소켓 전용 임시 서버가 먼저 뜨므로 TCP(127.0.0.1)로 확인해야 거짓 healthy 가 없다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *common
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: redis
    profiles: ["data"]
    mem_limit: 512m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  # =========================================================================
  # spark : Master + Worker x2 (PySpark 커스텀 이미지)              [서버1]
  #  - 체크포인트/이벤트로그 위치는 SPARK_CHECKPOINT_DIR / SPARK_EVENTLOG_DIR 환경변수로 주입.
  #    2단계: /opt/ddubi/checkpoints (로컬 볼륨) → 3단계: hdfs://hdfs-namenode:9000/ddubi/checkpoints
  # =========================================================================
  spark-master:
    <<: *common
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
      args:
        SPARK_IMAGE: apache/spark:${SPARK_VERSION:-3.5.3-python3}
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-master
    profiles: ["spark"]
    mem_limit: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "7077:7077"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HDFS_NAMENODE_URI: ${HDFS_NAMENODE_URI}
    volumes: *spark-volumes

  spark-worker-1:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-1
    profiles: ["spark"]
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  spark-worker-2:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-worker-2
    profiles: ["spark"]
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
    volumes: *spark-volumes
    depends_on:
      - spark-master

  # 스트리밍 잡 드라이버 (client 모드). 잡 하나당 서비스 하나. 실행: sparkjobs/submit.sh
  spark-streaming-weather:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-streaming-weather
    profiles: ["spark"]
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "submit.sh", "streaming/weather_latest.py"]
    ports:
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-latest}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2

  # 배치 잡 실행기 (일회성). 예: docker compose --profile batch run --rm spark-batch sh submit.sh batch/weather_baseline.py --days 28
  spark-batch:
    <<: *common
    image: ddubi/spark:${APP_VERSION:-0.1.0}
    container_name: spark-batch
    profiles: ["batch"]
    restart: "no"
    mem_limit: 1g
    working_dir: /opt/ddubi/sparkjobs
    command: ["sh", "-c", "echo 'usage: docker compose --profile batch run --rm spark-batch sh submit.sh batch/<job>.py [args]'"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPARK_VERSION: ${SPARK_VERSION:-3.5.3-python3}
      SPARK_CHECKPOINT_DIR: ${SPARK_CHECKPOINT_DIR}
      SPARK_EVENTLOG_DIR: ${SPARK_EVENTLOG_DIR}
      SPARK_EVENTLOG_ENABLED: ${SPARK_EVENTLOG_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BASELINE_INPUT_URI: ${BASELINE_INPUT_URI}
      BASELINE_OUTPUT_URI: ${BASELINE_OUTPUT_URI}
      BASELINE_WINDOW_DAYS: ${BASELINE_WINDOW_DAYS:-28}
      # 스트리밍 실행기(1g x2)가 워커 메모리(1536m x2)를 먼저 쓰고 있어, 배치는 남는 몫(≈500m) 안에서 돈다.
      # 더 크게 잡으면 자원을 못 받아 무한 대기하고, Spark 최소값(450m) 보다 작으면 시작을 거부한다. 워커 메모리를 늘리면 함께 올린다.
      SPARK_EXECUTOR_MEMORY: ${BATCH_EXECUTOR_MEMORY:-480m}
      SPARK_DRIVER_MEMORY: ${BATCH_DRIVER_MEMORY:-512m}
      SPARK_CORES_MAX: ${BATCH_CORES_MAX:-2}
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../sparkjobs:/opt/ddubi/sparkjobs
      - spark-checkpoints:/opt/ddubi/checkpoints
      - spark-events:/opt/ddubi/spark-events
      - spark-ivy:/opt/ddubi/ivy

  # =========================================================================
  # archive : Kafka -> Parquet 아카이버                            [서버1]
  #  - 2단계: ARCHIVE_URI=file://<ARCHIVE_LOCAL_DIR> 로컬 볼륨 / 3단계: webhdfs://hdfs-namenode:9870/... 로 값만 변경
  #  - 1시간 또는 128MB 단위 병합 (small files 방지). 파일을 쓴 뒤에만 오프셋 커밋
  # =========================================================================
  archiver:
    <<: *common
    build:
      context: ..
      dockerfile: archiver/Dockerfile
    image: ddubi/archiver:${APP_VERSION:-0.1.0}
    container_name: archiver
    profiles: ["archive"]
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Asia/Seoul}
      APP_ENV: ${APP_ENV:-local}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ARCHIVE_TOPICS: ${ARCHIVE_TOPICS:-transport.raw,city.raw}   # topics.yaml 의 archive: true 토픽
      ARCHIVE_LOCAL_DIR: ${ARCHIVE_LOCAL_DIR}
      ARCHIVE_URI: ${ARCHIVE_URI}
      ARCHIVE_HDFS_USER: ${ARCHIVE_HDFS_USER:-hadoop}
      ARCHIVE_FLUSH_MINUTES: ${ARCHIVE_FLUSH_MINUTES:-60}
      ARCHIVE_FLUSH_SECONDS: ${ARCHIVE_FLUSH_SECONDS:-}            # 개발·검증용. 비우면 분 단위 사용
      ARCHIVE_MAX_BYTES: ${ARCHIVE_MAX_BYTES:-134217728}
    volumes:
      - archive-data:${ARCHIVE_LOCAL_DIR}
    depends_on:
      kafka:
        condition: service_healthy
        required: false

  # =========================================================================
  # hdfs : NameNode + DataNode1 [서버1], DataNode2 [서버2]
  #  - namenode 는 최초 1회만 포맷하고 이후엔 그대로 기동한다.
  #  - 클라이언트(archiver→WebHDFS 9870, Spark→RPC 9000)는 데이터노드에 호스트명으로 접근한다.
  #    서버 2대로 나눌 때는 상대 서버 데이터노드 이름을 extra_hosts 로 사설 IP 에 매핑해야 한다.
  # =========================================================================
  hdfs-namenode:
    <<: *hdfs
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    command:
      - sh
      - -c
      - |
        if [ ! -f /hadoop/dfs/name/current/VERSION ]; then
          hdfs namenode -format -nonInteractive
        fi
        exec hdfs namenode
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # NameNode RPC
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-namenode-data:/hadoop/dfs/name

  hdfs-datanode1:
    <<: *hdfs
    container_name: hdfs-datanode1
    hostname: hdfs-datanode1
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode1-data:/hadoop/dfs/data
    depends_on:
      - hdfs-namenode

  hdfs-datanode2:
    <<: *hdfs
    container_name: hdfs-datanode2
    hostname: hdfs-datanode2
    # 서버2 전용 프로필. 서버1의 hdfs 프로필(namenode+datanode1)에 딸려가지 않게 분리했다.
    # 로컬(한 대)에서 복제 2를 채우려면 --profile hdfs --profile hdfs2 둘 다 켠다
    profiles: ["hdfs2"]
    command: ["hdfs", "datanode"]
    volumes:
      - ./hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - hdfs-datanode2-data:/hadoop/dfs/data
    depends_on:
      hdfs-namenode:
        condition: service_started
        required: false   # hdfs2 단독 기동 시 namenode 정의가 비활성이어도 깨지지 않게

  # =========================================================================
  # monitoring : Prometheus / Grafana / kafka-exporter [서버2], node-exporter [양쪽]
  # =========================================================================
  prometheus:
    <<: *common
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.55.1}
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.1}
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: 512m
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  kafka-exporter:
    <<: *common
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION:-v1.8.0}
    container_name: kafka-exporter
    # Kafka 와 같은 서버(서버1)에서 exporters 프로필로 띄운다. Prometheus(서버2)가 9308 을 원격 스크랩
    profiles: ["exporters"]
    mem_limit: 128m
    command:
      - --kafka.server=${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "9308:9308"

  node-exporter:
    <<: *common
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    container_name: node-exporter
    profiles: ["monitoring", "exporters"]   # 서버1은 exporters, 서버2는 monitoring 으로 양쪽 다 뜬다
    mem_limit: 128m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

networks:
  ddubi-network:
    name: ddubi-network

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  hdfs-namenode-data:
  hdfs-datanode1-data:
  hdfs-datanode2-data:
  spark-checkpoints:
  spark-events:
  spark-ivy:
  archive-data:
  prometheus-data:
  grafana-data:
