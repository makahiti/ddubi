# Grafana 통합 알림 규칙 (파일 프로비저닝). 화면에서 고친 내용은 저장되지 않는다 — 이 파일이 기준.
#
# 규칙마다 두 단계: A = Prometheus 순간 질의, C = 수식(참이면 1). C 가 0 이 아닌 상태가 `for` 시간 지속되면 발동.
# 알림을 어디로 보낼지는 contact-points 로 정한다 (팀 결정 전까지는 Grafana 화면 Alerting 메뉴에서만 보인다).
# 각 규칙의 runbook 주석은 docs/runbooks/ 의 절차서를 가리킨다.
apiVersion: 1
groups:
  - orgId: 1
    name: ddubi-service
    folder: DDUBI 알림
    interval: 1m
    rules:
      - uid: ddubi-backend-down
        title: backend 다운
        condition: C
        for: 1m
        labels: { severity: critical, layer: service }
        annotations:
          summary: backend 가 1분 이상 지표를 내지 않는다 (up=0). 사용자 API 전체 불가
          runbook: docs/runbooks/backend-down-and-nginx-502.md
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'up{job="backend"}' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      - uid: ddubi-mysql-down
        title: MySQL 다운
        condition: C
        for: 2m
        labels: { severity: critical, layer: service }
        annotations:
          summary: mysqld-exporter 가 MySQL 에 접속하지 못한다. backend 도 곧 실패한다
          runbook: docs/runbooks/backend-down-and-nginx-502.md (A-2 DB 절)
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: mysql_up }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      - uid: ddubi-redis-down
        title: Redis 다운
        condition: C
        for: 2m
        labels: { severity: critical, layer: service }
        annotations:
          summary: redis-exporter 가 Redis 에 접속하지 못한다. 실시간 조회와 Spark 쓰기가 실패한다
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: redis_up }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      - uid: ddubi-redis-memory-high
        title: Redis 메모리 90% 초과
        condition: C
        for: 5m
        labels: { severity: warning, layer: service }
        annotations:
          summary: used/maxmemory(384m) 가 90% 를 넘었다. volatile-ttl 이라 TTL 없는 키가 쌓인 것 → redis-keys.yaml 대조
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: "redis_memory_used_bytes / redis_memory_max_bytes * 100" }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 90" }

      # ml-serving(버스 구간 예측)이 죽었거나 모델이 준비되지 않았다. backend 는 카카오 값으로 대체하므로 사용자 장애는 아니지만,
      # 조용히 지나가면 며칠 동안 예측 없이 서비스되는 것을 아무도 모른다 (2026-09-15). 지표는 blackbox-exporter 가 만든다
      - uid: ddubi-ml-serving-down
        title: ml-serving 다운 (버스 예측은 카카오 값으로 대체 중)
        condition: C
        for: 5m
        labels: { severity: warning, layer: service }
        annotations:
          summary: ml-serving 의 /health/ready 가 5분 넘게 실패했다. docker logs ml-serving 에서 모델 묶음·메모리 확인. 사용자 API 는 카카오 값으로 계속 동작
          runbook: docs/runbooks/backend-down-and-nginx-502.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'probe_success{job="ml-serving"}' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

  - orgId: 1
    name: ddubi-data
    folder: DDUBI 알림
    interval: 1m
    rules:
      - uid: ddubi-collect-stalled
        title: 수집 중단 (city.raw 30분 무유입)
        condition: C
        for: 5m
        labels: { severity: warning, layer: data }
        annotations:
          summary: weather 수집기는 10분마다 14건을 넣어야 하는데 30분 동안 오프셋이 늘지 않았다. 수집기 로그·API 키 확인
          runbook: docs/runbooks/kafka-restart.md (수집기 동작 절)
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(increase(kafka_topic_partition_current_offset{topic="city.raw"}[30m]))' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      - uid: ddubi-archiver-lag-high
        title: 아카이버 저장 정지 (2시간 동안 커밋이 전진하지 않음)
        condition: C
        for: 10m
        labels: { severity: warning, layer: data }
        annotations:
          summary: >-
            아카이버는 토픽마다 한 시간 단위로 HDFS 에 저장한 뒤 커밋 위치를 앞으로 옮긴다. 어느 토픽이든 지난 2시간 동안
            메시지는 들어왔는데(유입 100건 초과) 커밋 위치가 한 번도 전진하지 않았으면 저장이 실패한 것 — HDFS 쓰기 실패 가능성.
            랙 크기는 기준으로 쓰지 않는다: 유입량에 따라 수만까지 정상이고, 두 토픽의 저장 시각이 달라 합계 랙은 0 으로 안 내려온다 (2026-09-10 수정)
          runbook: docs/runbooks/hdfs-datanode-down.md, reprocess-from-archive.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: "count((sum by (topic) (increase(kafka_consumergroup_current_offset{consumergroup=\"archiver\"}[2h])) < 1) and on (topic) (sum by (topic) (increase(kafka_topic_partition_current_offset[2h])) > 100)) or vector(0)" }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 0" }

      - uid: ddubi-spark-app-missing
        title: Spark 스트리밍 잡 부족
        condition: C
        for: 5m
        labels: { severity: critical, layer: data }
        annotations:
          summary: master 가 보는 실행 중 앱이 2 미만. weather_latest 또는 realtime_latest 가 죽어 재시작 반복 중일 수 있다
          runbook: docs/runbooks/spark-streaming-crash.md
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'metrics_master_apps_Value{type="gauges"}' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 2" }

      - uid: ddubi-hdfs-datanode-down
        title: HDFS 데이터노드 1대
        condition: C
        for: 5m
        labels: { severity: warning, layer: data }
        annotations:
          summary: Live 데이터노드가 2 미만. 복제 2 라 데이터는 남아 있지만 한 대 더 죽으면 유실. 죽은 노드를 살린다
          runbook: docs/runbooks/hdfs-datanode-down.md
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: hdfs_namenode_live_datanodes }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 2" }

      - uid: ddubi-hdfs-missing-blocks
        title: HDFS Missing 블록
        condition: C
        for: 1m
        labels: { severity: critical, layer: data }
        annotations:
          summary: 복사본이 하나도 없는 블록이 있다. 데이터 유실 위험. 죽은 노드 복구가 최우선
          runbook: docs/runbooks/hdfs-datanode-down.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: hdfs_namenode_missing_blocks }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 0" }

      # 서버2의 세컨더리 네임노드는 한 시간마다 네임노드 목차의 사본을 만든다. 세 시간 넘게 새 사본이 없으면 세컨더리가 죽었거나
      # 서버1에 붙지 못하는 것이다. 이 사본은 서버1 디스크를 잃었을 때 유일한 복구 수단이라, 조용히 멈추는 일을 알림으로 드러낸다.
      - uid: ddubi-hdfs-checkpoint-stale
        title: HDFS 체크포인트 멈춤
        condition: C
        for: 10m
        labels: { severity: warning, layer: data }
        annotations:
          summary: 세컨더리 네임노드(서버2)가 3시간 넘게 메타데이터 사본을 만들지 않았다. docker logs hdfs-secondarynamenode 확인
          runbook: docs/runbooks/hdfs-namenode-metadata-loss.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: (time() * 1000 - hdfs_namenode_last_checkpoint_time_ms) / 3600000 }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 3" }

      # Kafka 브로커가 죽으면 수집기·Spark·아카이버가 전부 멈추는데, 이를 직접 알리는 규칙이 없었다. "수집 중단" 은 30분 뒤에야 잡고
      # "수집 대상 DOWN" 은 kafka-exporter 자체는 살아 있어 잡지 못한다. kafka-exporter 가 보는 브로커 수가 0 이면 바로 알린다 (2026-09-15)
      - uid: ddubi-kafka-broker-down
        title: Kafka 브로커 다운
        condition: C
        for: 2m
        labels: { severity: critical, layer: data }
        annotations:
          summary: Kafka 브로커가 응답하지 않는다. 수집·Spark·아카이브가 전부 멈춘다. docker logs kafka 확인
          runbook: docs/runbooks/kafka-restart.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'kafka_brokers' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      # transport.raw 는 지하철 도착이 6분마다 2,900건씩 들어오는 가장 큰 토픽인데, 수집 중단 알림은 city.raw(날씨)만 보고 있었다 (2026-09-15).
      # 30분 동안 한 건도 안 들어오면 수집기 5개가 모두 죽었거나 API 키 문제다
      - uid: ddubi-transport-stalled
        title: 수집 중단 (transport.raw 30분 무유입)
        condition: C
        for: 5m
        labels: { severity: warning, layer: data }
        annotations:
          summary: transport.raw 에 30분 동안 새 메시지가 없다. 버스·지하철 수집기 5개 로그와 API 키 확인
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum(increase(kafka_topic_partition_current_offset{topic="transport.raw"}[30m]))' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      # 실측 생산자가 활성화된 뒤 판정 잡만 멈춘 경우를 잡는다. 실측 자체가 아직 없는 환경에서는 경고하지 않는다.
      - uid: ddubi-segment-status-stalled
        title: 구간 판정 생성 중단
        condition: C
        for: 5m
        labels: { severity: warning, layer: data }
        annotations:
          summary: segment.observation은 30분 동안 들어왔지만 segment.status가 한 건도 생성되지 않았다. recommendation-data 프로필과 segment status 잡 로그를 확인
          runbook: docs/contracts/recommendation-data-readiness.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '((sum(increase(kafka_topic_partition_current_offset{topic="segment.observation"}[30m])) or vector(0)) > bool 0) * ((sum(increase(kafka_topic_partition_current_offset{topic="segment.status"}[30m])) or vector(0)) < bool 1)' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 0" }

      # Spark 스트리밍 한 배치의 처리 시간(ms). 평소 3ms~13초인데, 9/11 대응표 OOM 사고 때는 32~52초로 늘다가 멈췄다.
      # 5분(트리거 간격)을 넘으면 배치가 밀리기 시작한 것이라 미리 알린다. 잡이 죽어 지표가 사라지는 경우는 "Spark 스트리밍 잡 부족" 이 잡는다 (2026-09-15)
      - uid: ddubi-spark-batch-slow
        title: Spark 배치 처리 5분 초과
        condition: C
        for: 10m
        labels: { severity: warning, layer: data }
        annotations:
          summary: Spark 스트리밍 배치 하나가 5분 넘게 걸린다. 드라이버 로그와 메모리(docker stats spark-streaming-*)를 확인. 9/11 처럼 커널 OOM 으로 이어질 수 있다
          runbook: docs/runbooks/spark-streaming-crash.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max({__name__=~"metrics_.*_driver_spark_streaming_.*_latency_Value"})' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 300000" }

  - orgId: 1
    name: ddubi-host
    folder: DDUBI 알림
    interval: 1m
    rules:
      - uid: ddubi-disk-high
        title: 디스크 80% 초과
        condition: C
        for: 10m
        labels: { severity: warning, layer: host }
        annotations:
          summary: 루트 디스크 사용률 80% 초과. Kafka 보존 단축, docker system prune, 아카이브 정리 검토
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"}) * 100'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 80" }

      - uid: ddubi-scrape-target-down
        title: 수집 대상 DOWN
        condition: C
        for: 3m
        labels: { severity: warning, layer: host }
        annotations:
          summary: Prometheus 가 읽는 대상 중 응답하지 않는 것이 있다. Status → Targets 에서 어느 것인지 확인
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'up{job!~"backend|mysql|redis"}' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 1" }

      # 호스트 메모리. 컨테이너마다 상한이 있어 한 개가 폭주해도 호스트가 바로 죽지는 않지만, 합이 90% 를 넘으면 커널이 아무 컨테이너든
      # 죽이기 시작한다(9/11 realtime 이 그렇게 죽었다). 디스크 알림은 있었는데 메모리 알림이 없었다 (2026-09-15)
      - uid: ddubi-memory-high
        title: 호스트 메모리 90% 초과
        condition: C
        for: 10m
        labels: { severity: warning, layer: host }
        annotations:
          summary: 서버 메모리 사용률이 10분 넘게 90% 를 넘는다. docker stats 로 어느 컨테이너인지 확인. 상한(mem_limit) 재배분 검토
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 90" }

      # OOM 킬. 컨테이너 하나가 자기 메모리 상한(mem_limit)에 닿으면 커널이 그 프로세스를 죽이고 도커가 다시 띄운다. 서비스는 몇 초 만에
      # 돌아오기 때문에 "다운" 규칙(5분 지속)에는 걸리지 않고, 호스트 메모리도 90% 와 무관하다. 2026-09-17 23:42 MySQL 이 이렇게 죽었는데
      # 아무 알림도 없었다. node-exporter 의 커널 OOM 카운터는 컨테이너 상한 초과도 함께 세므로 이 값이 10분 안에 늘면 알린다.
      # 재부팅하면 카운터가 0 으로 돌아가지만 increase() 가 리셋을 알아서 건너뛴다. 사건형 규칙이라 for 는 0 이고 10분 창이 지나면 저절로 해소된다
      - uid: ddubi-oom-kill
        title: OOM 킬 발생 (컨테이너가 메모리 상한에 죽었음)
        condition: C
        for: 0m
        labels: { severity: warning, layer: host }
        annotations:
          summary: 커널이 메모리 초과로 프로세스를 죽였다(도커가 다시 띄워 서비스는 곧 돌아온다). 어느 컨테이너인지 `sudo journalctl -k --since -20m | grep -i oom` 으로 확인하고 `docker ps` 재시작 횟수와 mem_limit 상향을 검토한다
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'increase(node_vmstat_oom_kill[10m])' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 0" }

      # MySQL·Redis 재시작. 데이터 저장소가 다시 시작되면 가동 시간(uptime)이 0 으로 돌아간다. 15분 안에 그런 리셋이 있으면 알린다.
      # 두 저장소는 compose 값이 바뀔 때만 재생성되어 재시작이 드물기 때문에, 계획된 재부팅·배포 때 한 번 오는 알림은 정상으로 본다.
      # backend 는 배포마다 재시작해 소음이 되므로 여기서 빼고, 기존 "backend 다운" 규칙과 서버1의 5분 감시에 맡긴다.
      # OOM 으로 죽은 경우는 위 규칙이 따로 알려 준다 (2026-09-18)
      - uid: ddubi-datastore-restarted
        title: MySQL·Redis 재시작 감지
        condition: C
        for: 0m
        labels: { severity: warning, layer: service }
        annotations:
          summary: MySQL 또는 Redis 프로세스가 15분 안에 다시 시작됐다. 계획된 재부팅·배포가 아니면 `docker inspect -f '{{.RestartCount}} {{.State.OOMKilled}}' mysql redis` 와 `journalctl -k` 로 원인을 확인한다
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'resets(mysql_global_status_uptime[15m]) or resets(redis_uptime_in_seconds[15m])' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A > 0" }

      # TLS 인증서 만료. certbot 이 12시간마다 갱신을 시도하지만 조용히 실패할 수 있다(갱신 설정에 standalone 이 남아 있음, 2026-09-15 발견).
      # blackbox 가 공개 주소를 https 로 찌를 때 알려 주는 만료 시각을 쓴다. 14일 전에 알리면 손으로 갱신할 시간이 충분하다
      - uid: ddubi-tls-cert-expiring
        title: TLS 인증서 만료 14일 전
        condition: C
        for: 1h
        labels: { severity: warning, layer: host }
        annotations:
          summary: 공개 도메인 인증서가 14일 안에 만료된다. certbot 자동 갱신이 실패한 것. docs/runbooks/tls-cert-renewal.md
          runbook: docs/runbooks/tls-cert-renewal.md
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: '(probe_ssl_earliest_cert_expiry{job="public-https"} - time()) / 86400' }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: math, expression: "$A < 14" }
