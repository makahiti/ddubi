# Grafana 기동 시 Prometheus 데이터소스를 자동 등록한다 (화면에서 수동 등록 불필요)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus          # 대시보드 JSON 이 이 uid 로 참조한다
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s      # prometheus.yml 의 scrape_interval 과 일치
