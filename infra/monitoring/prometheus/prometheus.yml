global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus 는 서버2(서비스)에서 돈다.
# 서버1 대상은 사설 IP 로 원격 스크랩 (서버1: 172.26.15.35 / 서버2: 172.26.6.220)
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # 서버 자원 (CPU/메모리/디스크/네트워크)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]        # 서버2 (같은 도커 네트워크)
        labels: { server: server2-service }
      - targets: ["172.26.15.35:9100"]         # 서버1 (exporters 프로필)
        labels: { server: server1-data }

  # Kafka 토픽·컨슈머 랙 (서버1의 kafka-exporter)
  - job_name: kafka
    static_configs:
      - targets: ["172.26.15.35:9308"]
        labels: { server: server1-data }

  # backend(Spring actuator). 같은 도커 네트워크 안에서 직접 읽는다 — nginx 는 /api·/internal 만 열어 두어
  # /actuator 는 바깥에서 닿지 않는다. up{job="backend"} 가 0 이면 backend 가 죽은 것 (2026-09-07 추가)
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels: { server: server2-service }

  # --- 2026-09-08 추가: Spark(master·드라이버·executor), HDFS(json_exporter), Redis, MySQL. 남은 것: 알림 규칙 ---
  # Spark 지표 경로는 infra/spark/conf/metrics.properties 의 PrometheusServlet sink 가 연다
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ["172.26.15.35:8080"]
        labels: { server: server1-data }

  - job_name: spark-driver
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["172.26.15.35:4040"]
        labels: { server: server1-data, job_name: weather_latest }
      - targets: ["172.26.15.35:4042"]
        labels: { server: server1-data, job_name: realtime_latest }

  - job_name: spark-executors
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ["172.26.15.35:4040", "172.26.15.35:4042"]
        labels: { server: server1-data }

  - job_name: hdfs
    metrics_path: /probe
    params: { module: [hdfs] }
    static_configs:
      - targets: ["http://hdfs-namenode:9870/jmx"]
        labels: { server: server1-data }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.26.15.35:7979

  # ml-serving(버스 구간 예측). 지표 주소가 없어 blackbox-exporter 가 /health/ready 를 대신 찔러 본다.
  # 결과는 probe_success{job="ml-serving"} 1(준비됨) / 0(죽었거나 모델 미준비). 0 이어도 backend 는 카카오 값으로 대체 동작한다 (2026-09-15)
  - job_name: ml-serving
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://ml-serving:8000/health/ready"]
        labels: { server: server2-service }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 공개 주소를 https 로 찔러 본다. 목적은 두 가지다. nginx 가 인증서까지 포함해 정상 응답하는지, 그리고 blackbox 가 함께 알려 주는
  # 인증서 만료 시각(probe_ssl_earliest_cert_expiry)으로 "인증서 만료 14일 전" 알림을 내기 위해서다 (2026-09-15).
  # certbot 자동 갱신이 조용히 실패해도 이 알림이 잡는다. 서버2 안에서 자기 공개 주소로 나가는 요청이라 완전한 바깥 시점은 아니다.
  - job_name: public-https
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://j15e202.p.ssafy.io/healthz"]
        labels: { server: server2-service }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { server: server2-service }

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels: { server: server2-service }
