spark.master                     spark://spark-master:7077
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone       Asia/Seoul
spark.ui.prometheus.enabled      true

# HDFS 에 쓸 때의 복제 계수. 복제 계수는 서버가 아니라 "쓰는 클라이언트"가 정하며, Spark 컨테이너에는
# infra/hdfs/hdfs-site.xml 이 마운트되지 않아 Hadoop 기본값(3)이 쓰였다 → 데이터노드 2대에서 영구 복제 부족.
# hdfs-site.xml 의 dfs.replication 과 같은 값으로 유지한다 (2026-09-03, 기준선 배치 출력에서 발견)
spark.hadoop.dfs.replication     2

# 체크포인트 / 이벤트로그 경로는 이 파일에 고정하지 않는다.
# 1단계: 로컬 볼륨(SPARK_CHECKPOINT_DIR, SPARK_EVENTLOG_DIR 환경변수, compose 에서 주입)
# 3단계: 같은 환경변수 값을 hdfs://hdfs-namenode:9000/ddubi/... 로 바꿔 HDFS 전환
# 실제 적용은 sparkjobs/submit.sh 가 --conf 로 넘긴다:
#   --conf spark.sql.streaming.checkpointLocation=$SPARK_CHECKPOINT_DIR
#   --conf spark.eventLog.enabled=true --conf spark.eventLog.dir=$SPARK_EVENTLOG_DIR
spark.sql.streaming.metricsEnabled   true
spark.metrics.namespace              ${spark.app.name}
