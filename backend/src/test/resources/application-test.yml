# 통합 테스트 프로파일.
# datasource / redis 주소는 IntegrationTestSupport 의 @DynamicPropertySource 가 채운다.
# dev 프로파일이 아니므로 backend/.env 는 읽지 않는다 — 개인 환경에 테스트가 좌우되지 않게 한다.

spring:
  jpa:
    hibernate:
      # 운영과 같다. Flyway 가 만든 스키마와 엔티티가 어긋나면 테스트가 기동 단계에서 실패한다.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ddubi:
  walking:
    # 통합 fixture의 좌표·가짜 키로 외부 카카오를 호출하지 않는다. 도보 HTTP는 전용 fixture에서 검증한다.
    enabled: false
  briefing:
    # 스케줄러 빈은 살려 두고 자동 실행만 막는다.
    #
    # 브리핑 검사는 dispatchDue(now) 에 시각을 넘겨서 실제 시계에 기대지 않게 만들어 뒀는데,
    # 정작 진짜 스케줄러는 그대로 1분마다 '실제 시각' 으로 돌고 있었다. 검사가 도는 도중에
    # 한 바퀴가 끼어들면 알림 행이 하나 더 생기고, 알림 개수를 세는 검사가 그때만 빨간불이 된다.
    #
    # ConditionalOnProperty 로 빈을 없애지 않는 이유: MorningBriefIntegrationTest 가
    # 스케줄러를 주입받아 tick() 을 직접 부른다(그게 KST 판정 검사의 대상이다). 빈을 지우면
    # 주입이 실패해서 컨텍스트 자체가 안 뜬다. 그래서 첫 실행을 하루 뒤로 미뤄 저절로는
    # 돌지 않게만 한다. 직접 부르는 것은 그대로 된다.
    scheduler-delay-ms: 86400000
  schedule:
    # 같은 이유. 지난 일정 자동 마감이 검사 도중 끼어들면 다른 검사의 일정이 닫힌다.
    # 전용 검사는 expireOverdue(now) 를 직접 부른다.
    expiry-delay-ms: 86400000
  recommendation:
    monitor-enabled: false
    commit-wakeup-enabled: false
    kafka-enabled: false
    # 통합 테스트는 시험 적용 모드다. 운영 기본값(SHADOW)은 수치만 기록하고 시간 계산에 쓰지 않는다.
    # TEST_APPLY는 아래 허용 값이 함께 있어야만 기동된다(운영 compose는 이 값을 전달하지 않는다).
    ml-apply-mode: TEST_APPLY
    ml-test-apply-allowed: true
  jwt:
    secret: ddubi-integration-test-secret-key-32-bytes-min
    access-token-validity: 60m
    refresh-token-validity: 14d
  external:
    kakao:
      base-url: http://localhost:1
      rest-api-key: test-rest-api-key
      oauth:
        # 실제 카카오를 부르지 않는다. OAuthClient 를 목으로 대체하므로 주소는 쓰이지 않는다.
        auth-url: http://localhost:1
        api-url: http://localhost:1
        rest-api-key: test-rest-api-key
        client-secret: ""
        app-id: "12345"

logging:
  level:
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
