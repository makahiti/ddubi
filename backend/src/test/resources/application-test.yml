# 통합 테스트 프로파일.
# datasource / redis 주소는 IntegrationTestSupport 의 @DynamicPropertySource 가 채운다.
# dev 프로파일이 아니므로 backend/.env 는 읽지 않는다 — 개인 환경에 테스트가 좌우되지 않게 한다.

spring:
  jpa:
    hibernate:
      # 운영과 같다. Flyway 가 만든 스키마와 엔티티가 어긋나면 테스트가 기동 단계에서 실패한다.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ddubi:
  walking:
    # 통합 fixture의 좌표·가짜 키로 외부 카카오를 호출하지 않는다. 도보 HTTP는 전용 fixture에서 검증한다.
    enabled: false
  recommendation:
    monitor-enabled: false
    commit-wakeup-enabled: false
    kafka-enabled: false
    # 통합 테스트는 시험 적용 모드다. 운영 기본값(SHADOW)은 수치만 기록하고 시간 계산에 쓰지 않는다.
    # TEST_APPLY는 아래 허용 값이 함께 있어야만 기동된다(운영 compose는 이 값을 전달하지 않는다).
    ml-apply-mode: TEST_APPLY
    ml-test-apply-allowed: true
  jwt:
    secret: ddubi-integration-test-secret-key-32-bytes-min
    access-token-validity: 60m
    refresh-token-validity: 14d
  external:
    kakao:
      base-url: http://localhost:1
      rest-api-key: test-rest-api-key
      oauth:
        # 실제 카카오를 부르지 않는다. OAuthClient 를 목으로 대체하므로 주소는 쓰이지 않는다.
        auth-url: http://localhost:1
        api-url: http://localhost:1
        rest-api-key: test-rest-api-key
        client-secret: ""
        app-id: "12345"

logging:
  level:
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
