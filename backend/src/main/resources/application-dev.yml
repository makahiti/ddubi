# 로컬 개발 프로파일.
# backend/docker-compose.dev.yml 로 띄운 MySQL·Redis 를 기본값으로 본다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ddubi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ddubi
    password: ddubi

  data:
    redis:
      host: localhost
      port: 6379
      password:

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ssafy.ddubi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
