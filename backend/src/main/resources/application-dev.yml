# 로컬 개발 프로파일.
# backend/docker-compose.dev.yml 로 띄운 MySQL·Redis 를 기본값으로 본다.
spring:
  # backend/.env 를 속성으로 읽어들인다(없으면 무시 — optional).
  # Spring Boot 는 .env 를 자동으로 읽지 않으므로 이 선언이 있어야
  # application.yml 의 ${KAKAO_REST_API_KEY} 같은 placeholder 가 채워진다.
  # 운영에서는 이 프로파일을 쓰지 않고 OS 환경변수로 주입한다(우선순위도 환경변수가 위).
  config:
    import: optional:file:./.env[.properties]

  datasource:
    # 로컬 기본값은 유지하되 관리 적재·테스트가 환경변수로 격리 DB를 선택할 수 있어야 한다.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ddubi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:ddubi}
    password: ${MYSQL_PASSWORD:ddubi}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    properties:
      hibernate:
        format_sql: true

# 로컬 전용 placeholder. 운영에서는 환경변수 JWT_SECRET 으로 주입한다.
# HS256 이라 최소 32바이트여야 하며, 짧으면 기동이 실패한다.
ddubi:
  jwt:
    secret: ${JWT_SECRET:ddubi-local-dev-only-secret-key-do-not-use-in-production}

logging:
  level:
    com.ssafy.ddubi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
