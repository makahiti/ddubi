spring:
  application:
    name: ddubi

  profiles:
    # 지정이 없으면 운영(prod)으로 뜬다. 개발 설정은 SPRING_PROFILES_ACTIVE=dev 를 명시해야만 켜진다(2026-09-18).
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    # connectionTimeZone=LOCAL&preserveInstants=false 는 "드라이버는 시각 값을 변환하지 마라" 는 뜻이다.
    # 예전 serverTimezone=Asia/Seoul 은 Timestamp 를 JVM 기본 시간대로 해석한 뒤 Asia/Seoul 로 다시
    # 렌더링해서, JVM 이 UTC 인 CI 에서만 저장값이 +9h 밀렸다. 우리 엔티티 시각은 전부
    # LocalDateTime/LocalTime 이라 애초에 변환할 대상이 아니다.
    # MySQL 세션 시간대(+09:00)는 건드리지 않는다 — 서버가 직접 찍는 CURRENT_TIMESTAMP(6) 는 KST 여야 한다.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ddubi}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&preserveInstants=false&characterEncoding=UTF-8
    username: ${MYSQL_USER:ddubi}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    # 스키마의 진실은 Flyway 다. Hibernate 는 절대 스키마를 건드리지 않고 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # hibernate.jdbc.time_zone 을 두지 않는다. 엔티티 시각은 전부 LocalDateTime/LocalTime,
          # 즉 시간대가 없는 타입이라 변환할 것이 없는데, 그 설정이 있으면 Hibernate 가
          # "JVM 기본 시간대로 해석 → Asia/Seoul 로 다시 렌더링" 을 끼워 넣는다. JVM 이 KST 면
          # 차이가 0 이라 조용하지만, CI 처럼 UTC 면 저장값이 +9h 밀린다. TIME 컬럼은 거기에
          # 더해 자정을 넘기며 한 바퀴 돌아 대소 비교까지 뒤집힌다(브리핑 대상 조회).
          # "지금이 몇 시인가" 는 저장 계층이 아니라 BusinessTime 이 KST 로 정한다.
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # 회원가입 이메일 인증 코드 발송.
  # 자격증명이 비어 있으면 실제로 보내지 않고 코드를 로그에만 남긴다(MailConfig).
  # 팀원이 앱 비밀번호 없이도 가입 흐름을 돌릴 수 있게 하려는 것이다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 메일 서버가 응답하지 않을 때 요청 스레드가 물리지 않게 한다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    # JSON 은 camelCase 다 (API 명세서 v2.1.1 기준). SNAKE_CASE 로 바꾸지 말 것 —
    # 프론트가 명세서 필드명(notifyLeadMin, unreadNotificationCount 등)으로 파싱한다.
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework # Nginx 뒤에서 X-Forwarded-* 반영

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 메일은 헬스 판정에서 뺀다. 자격증명이 비어 있거나 SMTP 가 막혀도 서비스는
    # 정상이어야 하는데, 이 인디케이터가 실패하면 /actuator/health 가 503 이 되어
    # 인프라(nginx·compose) 헬스체크가 앱을 죽은 것으로 오판한다.
    mail:
      enabled: false
  metrics:
    tags:
      application: ddubi

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

logging:
  pattern:
    # requestId 는 RequestIdFilter 가 MDC 에 넣는다. 장애 추적의 기준 키다.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

# --- 뚜비 도메인 설정 -------------------------------------------------
ddubi:
  jwt:
    secret: ${JWT_SECRET:} # 운영에서 반드시 주입. 비어 있으면 기동 실패시킬 것(Phase 1)
    access-token-validity: 60m
    refresh-token-validity: 14d
  subway-timing:
    # build_timetable.py가 만든 운행일별 JSON. 원본 CSV를 직접 지정하지 않는다.
    timetable-path: ${DDUBI_SUBWAY_TIMING_TIMETABLE_PATH:}
    # 카카오 총시간의 대기 포함 여부를 실측하기 전에는 계산 결과를 전체 ETA에 합치지 않는다.
    decomposition-verified: ${DDUBI_SUBWAY_TIMING_DECOMPOSITION_VERIFIED:false}
  schedule:
    # 반복 일정 인스턴스 선생성 지평선. 연장은 Phase 4 일일 잡이 맡는다.
    repeat-horizon-days: 14
  notification:
    # 같은 suppress_key 재발송 차단 시간. 상황이 실제로 바뀌면 키가 달라지므로
    # 이 값이 길어도 새 정보는 막히지 않는다.
    suppress-ttl: 10m
  briefing:
    # 아침 브리핑(REQ-NTF-003). 끄면 스케줄러 빈 자체가 만들어지지 않는다.
    enabled: ${DDUBI_BRIEFING_ENABLED:true}
    # 사용자가 정한 시각은 분 단위다. 더 드물게 돌면 07:00 으로 맞춘 사람이 07:05 에 받는다.
    scheduler-delay-ms: 60000
    # 브리핑 시각이 이만큼 지나면 그날은 건너뛴다. 서버가 아침 내내 죽어 있다가 저녁에
    # 올라왔다고 "아침 브리핑" 을 보내면 안 된다.
    max-lateness: 2h
  push:
    # 둘 다 비우면 로그 발송기로 대체된다(PushConfig). 키 없이도 개발이 된다.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  internal:
    # 서버1(Spark) 전용 API 키. 비어 있으면 /internal 전체를 503 으로 닫는다.
    # 메일·FCM 과 달리 "없으면 로그로 대체"가 아니다 —
    # 열어두면 네트워크 안에 들어온 누구나 기준선을 통째로 갈아치울 수 있다.
    api-key: ${INTERNAL_API_KEY:}
  pipeline:
    # 기준선 업서트를 몇 행씩 끊어 보낼지. 크면 메모리·패킷이, 작으면 왕복이 늘어난다.
    baseline-batch-size: 1000
  report:
    # 목표 시각 대비 이만큼 이상 일찍 도착해야 ON_TIME, 그 안쪽은 TIGHT.
    # 배차 간격을 생각하면 여유가 이보다 적을 때는 한 대만 놓쳐도 지각이다.
    # 데이터가 쌓인 뒤 조정할 값이라 코드에 박지 않는다.
    on-time-margin: 10m
  baseline:
    # 마지막 기준선 활성화가 이보다 오래되면 HOME dataState=STALE.
    stale-threshold: 48h
  auth:
    email-verification:
      # 사람이 메일을 열어 옮겨 적는 시간. 짧으면 재발송이 잦아진다.
      code-ttl: 5m
      # 재발송 도배 차단.
      resend-cooldown: 60s
      # 인증 후 가입까지 주는 시간. 닉네임·비밀번호 입력 시간이다.
      verified-ttl: 30m
  recommendation:
    policy-version: v1.0
    # 평가 결과로 자동 FCM 발송 (프론트 연동 질의 1번).
    #
    # ⚠️ 기본값 false 다. 지금 나가는 숫자는 미승인 모델이 계산한 것이라(production_ready=false)
    #    켜면 검증 안 된 값으로 사용자 폰이 울린다. 개발·테스트에서만 켜고 발표 전에 되돌린다
    #    (2026-09-15 프론트 확인).
    #
    # 추천 수락(사용자 출발 시각 실제 변경)은 이 설정과 무관하게 계속 막혀 있다.
    auto-notify-enabled: ${DDUBI_AUTO_NOTIFY_ENABLED:false}
    # 미승인(PREVIEW) 모델 결과로도 알림을 내보낸다. 본문에 검증용임을 표시한다.
    #
    # ⚠️ 기본값 false 다. productionReady=true 로 만드는 것과는 다르다 — 승인 게이트는
    #    그대로 두고, 검증 환경에서만 알림 경로를 열어 확인하기 위한 우회로다.
    #    발표 전에 되돌린다.
    shadow-preview-notify-enabled: ${DDUBI_SHADOW_PREVIEW_NOTIFY_ENABLED:false}
    # 다른 후보가 이만큼 빨라야 "경로 변경" 을 알린다. 1~2분 차이로 알리면 갈아타는 품이
    # 이득보다 크고, 후보 순위가 평가마다 흔들리면 알림이 쏟아진다.
    notify-route-gain: 5m
    # 중요도 → 백분위 (도메인 규칙 7)
    percentile:
      normal: 50
      high: 80
      critical: 95
    # 이 시간을 넘기면 202 + jobId 비동기로 전환 (성능 목표)
    sync-timeout: 2s
  walking:
    # 기본은 카카오 경로 승하차 끝점으로 조회한다. 공식 마스터 출입구 검증과 출처를 구분한다.
    enabled: ${DDUBI_WALKING_ENABLED:true}
    provider-endpoints: ${DDUBI_WALKING_PROVIDER_ENDPOINTS:true}
    base-url: https://dapi.kakao.com
    path: /v2/routing/walk
    timeout-millis: 1500
    cache-seconds: 60
    endpoint-max-meters: ${DDUBI_WALKING_ENDPOINT_MAX_METERS:0}
    master-coordinate-path: ${DDUBI_WALKING_MASTER_COORDINATE_PATH:}
  recommendation-guide:
    # GMS는 계산기가 아니라 최신 추천 사실을 짧은 한국어 안내로 바꾸는 표현 계층이다.
    enabled: ${DDUBI_RECOMMENDATION_GUIDE_ENABLED:true}
    base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi}
    # gpt-5.5-pro는 Chat Completions가 아니라 Responses API 계약을 사용한다.
    path: /api.openai.com/v1/responses
    api-key: ${GMS_API_KEY:}
    model: ${GMS_RECOMMENDATION_MODEL:gpt-5.5-pro}
    # Pro 모델은 추론 시간이 길 수 있다. 카드 결과는 evaluationId 단위 Redis 캐시로 재호출을 막는다.
    timeout-millis: ${GMS_RECOMMENDATION_TIMEOUT_MILLIS:20000}
  external:
    kakao:
      # 장소 검색과 대중교통 길찾기에 사용하는 카카오맵 REST API 주소
      base-url: https://dapi.kakao.com
      public-transit-path: /v2/routing/publictraffic
      # 실제 값은 .env 또는 배포 환경변수로 넣고 저장소에는 절대 커밋하지 않는다.
      rest-api-key: ${KAKAO_REST_API_KEY:}
      oauth:
        # 카카오 로그인은 길찾기(dapi)와 호스트가 다르다.
        #   kauth = 인가 코드를 액세스 토큰으로 교환
        #   kapi  = 액세스 토큰으로 사용자 정보 조회
        auth-url: https://kauth.kakao.com
        api-url: https://kapi.kakao.com
        # 같은 앱의 REST API 키다. 프론트가 로그인에 쓰는 앱과 동일해야 인가 코드가 교환된다.
        rest-api-key: ${KAKAO_REST_API_KEY:}
        # 콘솔 > 카카오 로그인 > 보안 에서 켰을 때만 필요하다. 안 켰으면 비워둔다.
        client-secret: ${KAKAO_CLIENT_SECRET:}
        # 모바일 SDK 액세스 토큰이 같은 카카오 앱에서 발급됐는지 검증할 숫자 앱 ID.
        app-id: ${KAKAO_APP_ID:}
    google:
      oauth:
        # 토큰 교환과 사용자 조회의 호스트가 다르다.
        auth-url: https://oauth2.googleapis.com
        api-url: https://www.googleapis.com
        # GCP 콘솔 > API 및 서비스 > 사용자 인증 정보 > OAuth 2.0 클라이언트 ID(웹 애플리케이션).
        client-id: ${GOOGLE_CLIENT_ID:}
        # 구글은 웹 애플리케이션 유형에서 시크릿이 항상 필수다(카카오와 달리 선택이 아니다).
        client-secret: ${GOOGLE_CLIENT_SECRET:}
    naver:
      oauth:
        auth-url: https://nid.naver.com
        api-url: https://openapi.naver.com
        # 네이버 개발자센터 > 애플리케이션 > 내 애플리케이션.
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
  metropolitan-bus:
    # BUS는 항상 수도권 마스터를 사용한다. 이 플래그는 관리 파일 적재에만 적용한다.
    import-enabled: ${DDUBI_METROPOLITAN_BUS_IMPORT_ENABLED:false}
    artifact: ${DDUBI_METROPOLITAN_BUS_ARTIFACT:}
    sha256: ${DDUBI_METROPOLITAN_BUS_SHA256:}
  transit-master-import:
    # 평상시 기동에는 반드시 false다. 관리자가 공식 파일을 새 버전으로 적재할 때만 true로 실행한다.
    enabled: ${DDUBI_TRANSIT_MASTER_IMPORT_ENABLED:false}
    data-version: ${DDUBI_TRANSIT_MASTER_DATA_VERSION:}
    subway-timetable: ${DDUBI_TRANSIT_MASTER_SUBWAY_TIMETABLE:}
    # [{"lineNumber":"2","subwayId":"1002","staticStationCode":"0222","externalCode":"222","realtimeStationId":"1002000222"}] 형식
    subway-realtime-stations: ${DDUBI_TRANSIT_MASTER_SUBWAY_REALTIME_STATIONS:}
    # 검증된 지하철 카카오 별칭 배열 JSON. verified=true인 행만 Matcher가 사용한다.
    aliases: ${DDUBI_TRANSIT_MASTER_ALIASES:}
  transit-mapping:
    # 다른 Backend replica가 새 ACTIVE 마스터 버전을 발견하는 최대 주기(ms)
    refresh-interval-ms: ${DDUBI_TRANSIT_MAPPING_REFRESH_INTERVAL_MS:60000}
