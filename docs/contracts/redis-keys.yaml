# Redis 키 계약
#
# 이 파일이 Redis 키의 진실이다. 코드에 키 문자열을 하드코딩하지 말고
# 상수/설정으로 분리한다. 키를 추가·변경하면 소유자가 이 파일을 먼저 고친다.
#
# owner: 그 키를 쓰는(=포맷을 정하는) 주체
#   - spark    : 분산 담당 소유. 백엔드는 읽기만 한다.
#   - backend  : 서비스 백엔드 소유.
#
# 메모리 정책 (infra/docker-compose.yml redis): maxmemory 384mb, maxmemory-policy volatile-ttl
#   - 상한에 닿으면 TTL 이 있는 키 중 만료가 가까운 것부터 지운다 → 캐시성 키(짧은 TTL)가 먼저,
#     상태성 키(auth:refresh, idem 등 긴 TTL)는 마지막까지 보호된다.
#   - TTL 없는 키는 절대 퇴출되지 않고 메모리를 계속 차지한다. TTL 없이 넣는 키는 반드시 이 파일에
#     ttlSeconds: null 로 명시하고 사유를 적는다 (지금은 notificationSuppress 만 정책값).

keys:
  # --- 분산 담당 소유 -------------------------------------------------
  segmentStatus:
    pattern: "segment:status:{segmentId}"
    ttlSeconds: 300
    owner: spark
    schema: events/segment-status.schema.json # 추가 진단 필드 구현, 담당자 소비 연동 확인 필요
    description: >-
      Spark가 계산한 구간별 최신 상태. 백엔드는 재평가 시 읽기만 한다.
      Spark Replay/발행 단계는 같은 JSON 스키마를 사용한다. 정책·상시 실행·Backend 소비 연동은 확인 대기다.
      300초는 보관 상한이며 실제 TTL은 validUntil까지 남은 시간보다 길지 않다.
      값이 없거나 stale 이면 baseline_serving 폴백 + confidence=LOW.
    valueExample: '{"segmentId":"BUS:100100609:123456:123789","status":"delayed","delaySeconds":420,"confidence":0.8,"causes":[{"eventId":"...","eventType":"road.incident","source":"seoul.topis"}],"computedAt":"2026-08-27T09:10:00+09:00","validUntil":"2026-08-27T09:15:00+09:00","source":"spark.segment-status"}'

  roadIncidents:
    pattern: "road:incidents:{namespace}:{linkId}"
    type: hash
    owner: spark
    ttlSeconds: 600
    description: >-
      source+providerIncidentId의 SHA 필드별 최신 사건 JSON. collectedAt+ROAD_MAX_AGE_SECONDS까지 보존한다.
      위 TTL은 기본이며 허용 설정 1~3600초다. 더 최신 사건의 hash TTL을 오래된 다른 사건으로 줄이지 않는다.
      사건이 없는 hash는 피드 정상/무사고를 의미하지 않는다. Backend는 freshness를 다시 확인한다.
  roadIncidentIndex:
    pattern: "road:incident-index:{sourceIncidentSha256}"
    type: string
    owner: spark
    ttlSeconds: 600
    description: "사건의 현재 링크 hash 키·수집시각·내용 해시·충돌 표시. 링크 변경 CAS용이며 standalone Redis 전용이다."

  weatherLatest:
    pattern: "weather:latest:{nx}:{ny}"
    ttlSeconds: 7200
    owner: spark
    description: >-
      Spark(streaming/weather_latest)가 격자별로 정리한 기상청 초단기실황 최신값.
      districts 는 이 격자를 공유하는 구 목록. 서버에서 가동 중.
    valueExample: '{"districts":["종로구","중구"],"nx":60,"ny":127,"baseDate":"20260827","baseTime":"0900","observations":{"T1H":27.3,"REH":64.0},"occurredAt":"2026-08-27T09:00:00.000+09:00","collectedAt":"2026-08-27T09:10:00.000+09:00","eventId":"...","source":"kma.ultra-srt-ncst"}'

  # latest 계열의 TTL은 보관 기간이다. 값의 validUntil(발생시각+freshnessSeconds) 이후는 stale이다.
  # retentionSeconds가 길어도 현재 위치/도착/혼잡/위험을 정상으로 간주하지 않는다.
  # 공지 중복 발행을 생략하면 마지막 변경 후 TTL이 끝날 수 있다. 진행 중 공지 전체 목록은 HDFS/별도 조회 대상이다.
  busPositionLatest:
    pattern: "transit:latest:bus-position:{providerRouteId}:{providerVehicleId}"
    ttlSeconds: 86400
    owner: spark
    description: >-
      Spark(streaming/realtime_latest)가 만든 서울 버스 차량별 최신 위치·운행 상태.
      routeId/vehicleId는 서울 API provider ID이며 canonical segment_id가 아니다.
      8시간 수집 주기의 세 배인 24시간 보관한다. validUntil 이후 현재 위치로 사용하지 않는다.

  busArrivalLatest:
    pattern: "transit:latest:bus-arrival:{providerRouteId}:{providerStopId}"
    ttlSeconds: 86400
    owner: spark
    description: >-
      노선·정류장별 다음 두 차량의 도착예정 초와 메시지. 도착예정값은 현재 관측이지
      실제 구간 운행시간 학습 정답이 아니다. 유일한 진입 edge 연결은 ARRIVAL_TARGET_INCOMING_EDGE이며 차량 위치를 뜻하지 않는다.
    observationContract:
      arrivalTimeBasis: 'SEOUL_EXPS_SECONDS_V1. 이 표시가 없는 예전 값은 Backend 대기 계산에서 사용하지 않는다.'
      firstArrivalSeconds: 'raw.exps1 정수 초. 기존 raw.traTime1(분) 직렬화 오류 수정. 결측은 생략.'
      secondArrivalSeconds: 'raw.exps2 정수 초. traTime2로 대체하지 않는다.'
      firstTravelTimeMinutes: 'raw.traTime1 숫자 분. 대기 입력이 아니다.'
      secondTravelTimeMinutes: 'raw.traTime2 숫자 분. 대기 입력이 아니다.'
      stopOrder: 'raw.staOrd 정수. 승차역의 노선상 순번과 비교한다.'
      sourceGeneratedAt: 'raw.mkTm 원문. 소수초 포함 KST 시각. 수집시각으로 채우지 않는다.'
      detourCode: 'raw.deTourAt 문자열. 00만 정상 경로로 대기 계산 허용.'
      firstTerminalArrivalCode: 'raw.isArrive1 문자열. 0 운행중만 허용.'
      secondTerminalArrivalCode: 'raw.isArrive2 문자열.'
      firstFullCode: 'raw.full1 문자열. 0만 탑승 후보로 허용.'
      secondFullCode: 'raw.full2 문자열.'

  regionalBusPositionLatest:
    pattern: "transit:latest:bus-position:{providerNamespace}:{providerRouteId}:{providerVehicleId}"
    ttlSeconds: 86400
    owner: spark
    description: GBIS·INCHEON_PUBLIC_CSV의 출처 ID 충돌 방지용 키. 해당 지역 수집기 구현 완료를 의미하지 않는다.

  regionalBusArrivalLatest:
    pattern: "transit:latest:bus-arrival:{providerNamespace}:{providerRouteId}:{providerStopId}"
    ttlSeconds: 86400
    owner: spark
    description: 서울은 기존 키를 유지한다. 값의 canonicalMapping에 대응표 버전·SHA·state·scope·reason을 보존한다.

  subwayPositionLatest:
    pattern: "transit:latest:subway-position:{providerLineId}:{providerTrainId}"
    ttlSeconds: 10800
    owner: spark
    description: >-
      호선·열차별 최신 역, 방향, 종착역과 운행상태. 실시간 subwayId/statnId를
      canonical 정적 ID로 간주하지 않으며 segmentIds가 있을 때만 매핑 가능으로 표시한다.
    optionalObservationFields:
      sourceGeneratedAt: 'raw.recptnDt 원문. Backend는 occurredAt과 일치하는 생성시각이 있어야 실시간 탑승 근거로 사용한다.'

  subwayArrivalLatest:
    pattern: "transit:latest:subway-arrival:{providerLineId}:{providerStationId}:{providerTrainId}"
    ttlSeconds: 1080
    owner: spark
    description: >-
      호선·역·열차별 도착예정 초와 도착상태. 동일 열차가 여러 역 조회에 포함되므로
      역 ID까지 키에 포함하며, Backend가 provider ID 기반 최신값을 조회할 때 사용한다.
    optionalObservationFields:
      arrivalTrainType: 'raw.btrainStt 원문(일반/급행 등). 시간표의 검증된 열차 종류와 비교한다.'
      sourceGeneratedAt: 'raw.recptnDt 원문. 누락은 null/생략이며 collectedAt으로 채우지 않는다.'

  trafficFlowLatest:
    pattern: "traffic:latest:flow:{providerLinkId}"
    ttlSeconds: 900
    owner: spark
    description: >-
      TOPIS 링크별 최신 속도(km/h), 통행시간(초), 소통상태. providerLinkId와 DDUBI
      segment_id 사이의 crosswalk가 확정되기 전에는 segment:status를 만들지 않는다.

  trafficIncidentLatest:
    pattern: "traffic:latest:incident:{providerIncidentId}"
    ttlSeconds: 2700
    owner: spark
    description: >-
      TOPIS 사고·통제별 최신 요약. 15분 수집 주기의 세 배인 45분 보관하며
      validUntil 이후 현재 위험 판정에 쓰지 않는다. 원문은 HDFS에서 eventId로 추적한다.

  cityAreaLatest:
    pattern: "city:latest:area:{providerAreaId}"
    ttlSeconds: 64800
    owner: spark
    description: >-
      서울 주요 장소별 인구 혼잡도·인구 범위·평균 도로속도·기상 대표값.
      6시간 수집 주기의 세 배인 18시간 보관한다. validUntil 이후 기준선으로 fallback한다.

  sdotPopulationLatest:
    pattern: "city:latest:sdot-population:{providerSensorId}"
    ttlSeconds: 1800
    owner: spark
    description: >-
      S-DoT 센서별 최신 유동인구 관측. 값의 visitorCount 단위는 명이며 10분 수집이
      세 번 연속 실패하면 만료한다. 센서 좌표·행정구역 보강은 별도 마스터의 책임이다.

  subwayAlertLatest:
    pattern: "transit:latest:subway-alert:{providerAlertId}"
    ttlSeconds: 2700
    owner: spark
    description: >-
      서울교통공사 이례상황 알림별 제목·내용·호선·종료시각 요약. 알림 자체는 지연 분의
      정답이 아니며, 구간 crosswalk와 실제 관측 악화가 결합될 때 위험 원인으로 사용한다.

  topisNoticeLatest:
    pattern: "traffic:latest:topis-notice:{providerNoticeId}"
    ttlSeconds: 2700
    owner: spark
    description: >-
      TOPIS 공지사항별 최신 제목·본문·분류. 공지 고유 ID를 키로 사용하고 원문은 HDFS에 보존한다.

  # --- 백엔드 소유 ----------------------------------------------------
  authRefresh:
    pattern: "auth:refresh:{userId}:{deviceId}"
    ttlSeconds: 1209600 # 14d
    owner: backend
    description: >-
      현재 유효한 리프레시 토큰의 jti. 회전 시 원자적으로 교체하고,
      재사용이 감지되면 해당 사용자의 모든 기기 세션을 폐기한다.

  revokedAccessToken:
    pattern: "auth:revoked:{userId}"
    ttlSeconds: 3600 # 액세스 토큰 유효기간과 동일
    owner: backend
    description: >-
      사용자의 현재 액세스 토큰 세대 번호. 탈퇴하거나 리프레시 재사용이 감지되면
      값을 올리고, 인증 필터는 JWT 의 세대와 비교해 이전 토큰만 거부한다.
      새 토큰을 발급할 때 TTL 을 연장해 현재 세대 토큰보다 먼저 사라지지 않게 한다.

  idempotency:
    pattern: "idem:{userId}:{path}:{key}"
    ttlSeconds: 86400 # 24h
    owner: backend
    description: >-
      Idempotency-Key 헤더로 받은 요청의 최초 응답 캐시.
      같은 사용자·경로·키로 24h 내 재요청하면 최초 응답을 그대로 반환한다.

  notificationSuppress:
    pattern: "ntf:suppress:{suppressKey}"
    ttlSeconds: null # 정책값 (알림 type 별로 다름)
    owner: backend
    description: >-
      알림 재발송 방지 (REQ-NTF-002). suppressKey = 일정·이유·행동 조합 해시로
      notification.suppress_key 컬럼과 같은 값이다.
      억제되어도 notification 행은 status=SUPPRESSED 로 반드시 생성한다.

  recalcLock:
    pattern: "lock:recalc:schedule:{scheduleId}"
    ttlSeconds: 60
    owner: backend
    description: 같은 일정에 대한 재계산이 동시에 돌지 않게 막는 분산 락.

  recalcJob:
    pattern: "job:recalc:{jobId}"
    ttlSeconds: 3600
    owner: backend
    description: >-
      2초를 초과해 202 + jobId 로 전환된 재계산 작업의 상태.
      MySQL에 작업 상태 테이블을 만들지 않는다.

  routeCandidates:
    pattern: "route:candidates:{originHash}:{destinationHash}"
    ttlSeconds: 600
    owner: backend
    description: 외부 길찾기 API(카카오맵) 후보 경로 단기 캐시.

# ---------------------------------------------------------------------
# segment_id 채번 계약
# 주석이 아니라 YAML 필드로 선언해 Backend·Collector·Spark가 같은 값을 검증할 수 있게 한다.
# ---------------------------------------------------------------------
# route_segment.segment_id, baseline_serving.segment_id, segment:status 키,
# 수집기의 이벤트→구간 매핑이 전부 같은 체계를 써야 성립한다.
#
# 확정 형식 (아래 segmentId 계약과 Factory·배포 대응표로 관리):
#   BUS:{노선ID}:{정류장A}:{정류장B}
#   SUB:{호선}:{역A}:{역B}
#
# 미해결:
#   - 최초 채번 주체: Backend Factory, Collector/Spark는 같은 정적 대응표 사용
#   - WALK 구간 처리 (현재 segment_id = NULL. 도보 가중치를 백엔드가 직접
#     계산할지, Spark가 도보용 키도 만들지 확정 필요) — B-1-b
#
# 단위 (B-1-d): baseline_serving p50/p80/p95 = 초,
#               route/route_segment/recommendation duration = 분

  emailVerificationCode:
    key: "auth:email:code:{email}"
    type: string
    ttl: 5m
    owner: backend
    value: "6자리 인증 코드"
    description: >
      회원가입 이메일 인증 코드. email 은 소문자로 정규화해서 키를 만든다 —
      대소문자만 바꿔 인증을 우회하는 경로를 막는다.

  emailVerificationAttempt:
    key: "auth:email:attempt:{email}"
    type: string
    ttl: 코드와 동일
    owner: backend
    value: "틀린 횟수"
    description: >
      5회를 넘기면 코드를 폐기한다. 6자리는 상한이 없으면 대입으로 뚫린다.

  emailVerificationCooldown:
    key: "auth:email:cooldown:{email}"
    type: string
    ttl: 60s
    owner: backend
    description: 재발송 도배 차단. 남아 있으면 400.

  emailVerified:
    key: "auth:email:verified:{email}"
    type: string
    ttl: 30m
    owner: backend
    description: >
      인증을 마친 이메일에 주는 가입 통행증. 가입이 성립하면 소비(삭제)한다.
      한 번 인증으로 계정을 여러 개 만들지 못하게 한다.
segmentId:
  contractVersion: canonical-adjacent-v2
  status: VERSIONED_ARTIFACT_IMPLEMENTED_DEPLOYMENT_REQUIRED
  namespace: METROPOLITAN_BUS_AND_SUBWAY
  issuer: backend
  issuerDescription: >-
    Backend가 BUS와 SUBWAY의 활성 정적 마스터에서 확정한 뒤,
    승차~하차 경로를 공식 인접 노드 쌍으로 분해하며 최초 발급한다.

  # DB·이벤트 계약은 향후 namespace 확장을 고려해 180자를 허용한다.
  # 현재 v1의 이론상 최대 길이는 prefix 3 + 구분자 3 + 구성요소 50*3 = 156자다.
  maxLength: 180
  computedV1MaxLength: 156
  component:
    minLength: 1
    maxLength: 50
    pattern: '^[A-Za-z0-9._-]+$'
    forbidden: [whitespace, colon, control-character, display-name]

  modes:
    BUS:
      format: 'BUS:{staticRouteId}:{staticFromStopId}:{staticToStopId}'
      example: 'BUS:100100609:123456:123789'
      routeIdSource: metropolitan_bus_master.artifact.routes.namespace+routeId
      nodeIdSource: metropolitan_bus_master.artifact.routes.stops.namespace+stopId
      regionalExample: 'BUS:GBIS.1:GBIS.10:GBIS.11'
      namespaceRule: 'SEOUL_BUS는 원본 ID 유지. GBIS·INCHEON_PUBLIC_CSV는 각 구성요소에 namespace. 접두사를 붙인다.'
    SUBWAY:
      format: 'SUB:{staticSubwayId}:{staticFromStationId}:{staticToStationId}'
      example: 'SUB:2:0222:0223'
      routeIdSource: 'seoul_subway_line.subway_id 또는 metropolitan-subway-master.lines.subwayId'
      nodeIdSource: 'seoul_subway_station.station_id 또는 metropolitan-subway-master.lines.stations.stationId'
      regionalExample: 'SUB:KRIC.S2802:KRIC.S2802.3209:KRIC.S2802.3210'
      namespaceRule: '기존 서울 시간표 ID 유지. 추가 KRIC 호선은 KRIC.{공식노선번호}, 역은 KRIC.{정적원본노선번호}.{역번호}. GTX-A 운영사 코드는 GTXA.A 및 GTXA.{역코드}.'
      artifactContract: metropolitan-subway-master.md
    WALK:
      format: null
      reason: 도보는 공식 대중교통 인접구간이 아니므로 segment_id를 발급하지 않는다.

  invariants:
    - 한 ID는 공식 마스터에서 실제로 인접한 방향성 노드 쌍 하나만 나타낸다.
    - A→B와 B→A는 서로 다른 segment_id다.
    - 카카오 노선명·정류장명·역명은 ID 구성요소로 사용하지 않는다.
    - 실시간 API의 subwayId·statnId는 ID 구성요소로 사용하지 않고 별도 crosswalk로 관리한다.
    - 미확정 경로에는 ID를 발급하지 않는다. 다중 대안 PARTIAL은 CONFIRMED+VERIFIED인 후보를 명시적으로 선택한 후 그 경로만 발급한다.
    - 여러 정거장을 지나는 provider step은 하나의 집계 ID가 아니라 인접 segment_id 목록으로 저장한다.
    - masterDataVersion과 mappingPolicyVersion은 재현 메타데이터이며 segment_id 문자열에는 넣지 않는다.

  storageAndConsumers:
    mysql:
      - route_segment_edge.segment_id
      - baseline_serving.segment_id
      - detection_log.segment_id
    kafka:
      - events/segment-status.schema.json#segmentId
      - events/transport-event.schema.json#segmentIds
      - events/city-event.schema.json#segmentIds
    redis: 'segment:status:{segmentId}'

  pipelineDistribution:
    artifact: metropolitan-bus-v6.crosswalk.json.gz
    schemaVersion: 1
    configuration: [BUS_CROSSWALK_PATH, BUS_CROSSWALK_SHA256]
    lifecycle: 같은 마스터에서 생성한 파일·SHA를 Collector/Spark 기동 시 고정하고 함께 재시작한다.
    contract: metropolitan-segment-integration.md
  unresolved:
    vehiclePosition: 검증된 from/to 정류장 ID가 없는 위치 관측은 구간 ID를 추측하지 않는다.
    trainingCrosswalk: 모델 학습 ID 대응·전처리·bundle의 운영 승인은 별도 검증이 필요하다.
    deployment: 코드 구현과 운영 배포는 구분한다. V4·마스터 적재·대응표 배포가 필요하다.

units:
  baselineServingPercentiles: seconds
  routeAndRecommendationDuration: minutes
