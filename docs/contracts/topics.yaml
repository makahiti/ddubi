# Kafka 토픽 계약. infra/scripts/create-topics.sh 가 이 파일을 기준으로 토픽을 만든다.
#
# - partitions       : 기본 3 (compose 의 KAFKA_NUM_PARTITIONS 와 동일)
# - replicationFactor: 단일 브로커라 1. 브로커를 늘리면 여기서 올린다.
# - retentionHours   : 원본(raw) 토픽은 21일(504h). HDFS 정착(3단계) 후에만 단축한다.
# - retentionBytes   : 파티션 하나당 상한. 기본 1GiB (compose 의 KAFKA_RETENTION_BYTES 와 동일).
#                      시간보다 먼저 용량에 걸리면 삭제되므로 수집량 확인 후 조정 필요.
# - schema           : 메시지 값이 따라야 하는 JSON Schema (docs/contracts/events/)
# - key              : 메시지 키. 같은 키는 같은 파티션에 순서대로 들어간다
# - archive          : archiver 가 Parquet 으로 보관하는 대상인지
#
# 위치 처리 원칙: 공간 연산은 DB 에서 하지 않는다. 행사·사고·통제 위치는 수집·전처리 단계에서
# 뚜비 내부 구간 ID(segmentIds)로 변환되고, 구간 상태는 segment.status 로 흘러 Redis 에 저장된다.

topics:
  source.poll-status:
    description: 수집 사이클별 정상 빈 응답, 부분 성공, 실패, 호출 제한, 비운행 생략 상태
    partitions: 3
    replicationFactor: 1
    retentionHours: 504
    retentionBytes: 1073741824
    schema: events/source-poll-status.schema.json
    key: source와 scopeKey
    producer: collector
    consumers: [backend, archiver]
    archive: true

  transport.raw:
    description: 정규화 전후 교통 수집 이벤트 (bus, subway, traffic 수집기)
    partitions: 3
    replicationFactor: 1
    retentionHours: 504
    # 2026-09-09 1GiB → 4GiB/파티션. 실시간 수집 계획(지하철 도착 전체 역 6분 주기 등)으로 하루 약 200MB 가 들어오면
    # 1GiB 는 약 15일 만에 21일보다 먼저 걸린다. 21일치(약 4.2GB/토픽)에 여유를 두어 4GiB×3 = 12GiB. 디스크 여유 293GB.
    # 서버 반영: infra/scripts/create-topics.sh (기존 토픽은 보존 설정만 갱신). 근거: docs/data-retention.md 3절
    retentionBytes: 4294967296
    schema: events/transport-event.schema.json
    key: provider ID (노선·역·링크 등 소스별 식별자)
    producer: collector
    consumers: [spark, archiver]
    archive: true

  city.raw:
    description: 날씨·행사·사고·통제 이벤트 (weather, event 수집기). 위치는 location 원본 + segmentIds(전처리 후)
    partitions: 3
    replicationFactor: 1
    retentionHours: 504
    retentionBytes: 1073741824
    schema: events/city-event.schema.json
    key: 소스별 위치 단위 (날씨는 격자 "nx:ny", 행사·사고는 provider ID)
    producer: collector
    consumers: [spark, archiver]
    archive: true

  segment.status:
    description: Spark가 계산한 구간(segment_id)별 최신 상태와 판정 이력. Redis segment:status:{segmentId} 와 같은 값이며 HDFS 아카이브로 재현한다.
    partitions: 3
    replicationFactor: 1
    retentionHours: 24
    retentionBytes: 1073741824
    schema: events/segment-status.schema.json
    key: segmentId
    producer: spark
    consumers: [backend, archiver]
    archive: true

  # ⚠️ 미구현 — 발행자도 소비자도 없다 (2026-09-09 확인, 백엔드)
  #
  #   producer  backend       : 발행 코드 없음
  #   consumer  notification   : 그런 서비스가 저장소에 없다 (compose 에도 없음)
  #
  # 현재 알림은 이 토픽을 거치지 않는다. backend 안에서 NotificationService 가
  # 억제 판정 → FCM 발송까지 직접 처리한다(구현·테스트 완료).
  #
  # 왜 안 거치나: Phase 4 알림을 만들 때 이 토픽을 확인하지 못했고, 지금 와서
  # 경로를 바꾸려면 notification 서비스를 새로 만들어야 하는데 담당자가 없다.
  # 발행만 하고 소비자를 안 두면 알림이 조용히 사라지므로 반쪽 도입은 하지 않는다.
  #
  # 정의를 지우지 않고 남기는 이유: create-topics.sh 가 이 파일로 토픽을 만들기 때문에
  # 지우면 이미 생성된 토픽만 서버에 남아 반대 방향으로 어긋난다. 그리고 알림 분리가
  # 필요해지면 이 계약을 그대로 쓸 수 있다.
  #
  # 되살리려면: notification 서비스 담당자 지정 → 소비자 구현 → backend 발행 추가 (이 순서)
  notification.requested:
    description: "Backend가 발행하는 알림 요청 (미구현 — 위 주석 참조. 현재 알림은 backend 내부에서 직접 FCM 발송)"
    partitions: 3
    replicationFactor: 1
    retentionHours: 72
    retentionBytes: 1073741824
    schema: events/notification-event.schema.json
    key: userId
    producer: backend
    consumers: [notification]
    archive: false

  road.impact:
    description: "검증 도로 링크에 대응한 버스 구간의 재평가 신호. 실제 통과시각 판정은 Backend가 수행한다. blocked 상태가 아니다."
    partitions: 3
    replicationFactor: 1
    retentionHours: 24
    retentionBytes: 1073741824
    schema: events/road-impact.schema.json
    key: segmentId
    producer: spark
    consumers: [backend]
    archive: false

  segment.observation:
    description: "실제 통과시각 원천을 확보한 생산자의 정규화 사실. 도착예측·평균통계는 이 토픽에 발행하지 않는다. Spark가 원문과 offset을 별도 Parquet에 보존한다."
    partitions: 3
    replicationFactor: 1
    retentionHours: 504
    retentionBytes: 1073741824
    schema: segment-observation.schema.json
    key: segmentId
    producer: verified-observation-adapter
    consumers: [spark]
    archive: false
