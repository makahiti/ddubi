# DDUBI CI
# - 파이프라인은 세 자리에서만 돈다 (2026-09-11, 같은 커밋 중복 검사 제거):
#     1) 브랜치 push (feature·infra·develop·master) — MR 열기 전에 결과를 본다
#     2) develop 을 대상으로 하는 MR — 여러 파트가 처음 만나는 최종 통합 검사
#     3) develop 머지 뒤 — 머지 커밋 검사 + 배포 버튼
#   파트 통합 브랜치(fe/dt/be 의 dev·main)는 이미 검사된 커밋만 받으므로 push 파이프라인을 만들지 않고,
#   develop 이 아닌 대상(feature → 파트 브랜치)의 MR 도 push 에서 검사됐으므로 만들지 않는다
# - 각 컴포넌트는 관련 파일이 바뀔 때만 테스트한다 (rules: changes)
# - sparkjobs 는 클러스터 이미지(apache/spark 3.5.3)와 같은 Python 3.8 로 테스트해 문법 호환까지 확인한다
# - 이미지 빌드는 dind(privileged) 러너가 필요해 수동 잡으로 둔다. 배포는 서버 이식(9단계) 후 추가

stages:
  - validate
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(fe|dt|be)\/(dev|main)$/
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true   # 같은 브랜치에 새 push 가 오면 이전 파이프라인을 자동 취소한다. 배포 잡만 예외(.deploy)

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------
structure-check:
  stage: validate
  image: alpine:3.20
  script:
    - test -d client
    - test -d backend
    - test -d notification
    - test -d collector
    - test -d archiver
    - test -d sparkjobs
    - test -d infra
    - test -d docs/contracts
  rules:
    - changes:
        - "**/*"

# compose 문법·변수 참조 검증 (데몬 불필요: config 는 파싱만 한다)
compose-validate:
  stage: validate
  image: docker:27-cli
  script:
    - cd infra
    - cp .env.example .env
    - docker compose --profile core --profile collect --profile data --profile serving --profile spark
      --profile batch --profile archive --profile hdfs --profile hdfs2 --profile monitoring
      --profile exporters config -q
    # 서버 오버레이 검증 (IP 는 필수 변수라 더미 값 주입)
    - export SERVER1_PRIVATE_IP=10.0.0.1 SERVER2_PRIVATE_IP=10.0.0.2
    - docker compose -f docker-compose.yml -f docker-compose.server1.yml --profile hdfs --profile spark --profile archive config -q
    - docker compose -f docker-compose.yml -f docker-compose.server2.yml --profile data --profile hdfs2 config -q
  rules:
    - changes:
        - infra/**/*

# 계약 파일 파싱 검증 (YAML/JSON 이 깨진 채 병합되는 것 방지)
contracts-validate:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install --quiet pyyaml
    # 한 줄 유지: 여러 줄로 접으면 YAML 이 앞에 공백을 붙여 python -c 가 IndentationError 로 죽는다
    - python -c "import yaml, json, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('docs/contracts/*.yaml')]; [json.load(open(f, encoding='utf-8')) for f in glob.glob('docs/contracts/events/*.json')]; print('contracts OK')"
  rules:
    - changes:
        - docs/contracts/**/*

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
collector-test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [collector/requirements.txt]
    paths: [.cache/pip]
  script:
    - pip install -r collector/requirements.txt
    - cd collector && python -m pytest -q
  rules:
    - changes:
        - collector/**/*
        - docs/contracts/events/*.json   # 계약-모델 일치 테스트가 이 파일들을 읽는다

archiver-test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [archiver/requirements.txt]
    paths: [.cache/pip]
  script:
    - pip install -r archiver/requirements.txt
    - cd archiver && python -m pytest -q
  rules:
    - changes:
        - archiver/**/*

sparkjobs-test:
  stage: test
  image: python:3.8-slim   # 클러스터(apache/spark:3.5.3-python3)와 같은 파이썬 버전
  cache:
    key:
      files: [sparkjobs/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless > /dev/null
  script:
    - pip install -r sparkjobs/requirements-dev.txt
    - cd sparkjobs && python -m pytest -q
  rules:
    - changes:
        - sparkjobs/**/*

# backend 통합 테스트: docs/contracts/backend-ci-requirements.md 의 정의를 그대로 옮김.
# 테스트가 Testcontainers 로 MySQL 8·Redis 7 컨테이너를 직접 띄우므로 도커 데몬이 필요하고,
# 잡 컨테이너에는 데몬이 없어 dind 서비스 컨테이너의 데몬을 쓴다 (러너 privileged=true 필요).
# 시간대(+09:00)·문자셋(utf8mb4)은 테스트 코드(IntegrationTestSupport)가 컨테이너를 띄울 때 지정한다.
backend-test:
  stage: test
  resource_group: backend-test          # dind 안에 MySQL·Redis 를 띄우는 무거운 잡. 러너 동시 실행 2 에서도 한 번에 하나만
  image: eclipse-temurin:17-jdk        # 팀 표준 Java 17
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    # Testcontainers 가 띄운 컨테이너는 dind 안에 있다. 이 값이 없으면 테스트가 localhost 로 붙으려다 전부 실패한다
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    # 정리 컨테이너(ryuk)는 dind 에서 자주 막힌다. 잡이 끝나면 dind 가 통째로 사라지므로 없어도 된다
    TESTCONTAINERS_RYUK_DISABLED: "true"
  cache:
    key:
      files: [backend/pom.xml]
    paths: [.m2/repository]
  script:
    # mvnw 가 깃에 실행 권한 없이(100644) 올라가 있어 chmod 가 필요하다. 권한이 고쳐지면 지워도 된다
    - cd backend && chmod +x mvnw && ./mvnw -B -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository test
  rules:
    - changes:
        - backend/**/*
        - docs/ddubi_erd_v2.sql          # 스키마 원천. V1__init.sql 과 항상 같아야 하므로 바뀌면 테스트를 돌린다

# 클라이언트(Flutter) 정적 분석 + 단위 테스트. 팀장(FE 담당) 요청: client 변경 시 자동, 빌드는 수동.
# 이미지는 클라이언트가 기준으로 삼는 Flutter 3.47.2 (pubspec.lock: Flutter >=3.44, Dart >=3.13.2).
# cirruslabs/flutter 에는 3.47 태그가 없어 FE 담당이 지정한 gmeligio 이미지를 쓴다.
.flutter:
  image: ghcr.io/gmeligio/flutter-web:3.47.2
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"   # 잡 사이에 패키지 캐시를 유지하기 위해 프로젝트 안으로
  cache:
    key:
      files: [client/pubspec.lock]
    paths: [.pub-cache]
  before_script:
    - cd client
    - flutter --version
    - flutter pub get

client-test:
  extends: .flutter
  stage: test
  resource_group: client-test           # CPU 를 많이 쓰는 잡. 같은 잡끼리만 순서대로, backend-test 와는 겹쳐도 된다
  script:
    - flutter analyze
    - flutter test
  rules:
    - changes:
        - client/**/*

# ---------------------------------------------------------------------------
# build (수동): 이미지 빌드 검증. dind(privileged) 러너 필요
#  - SSAFY GitLab 은 컨테이너 저장소가 없어(CI_REGISTRY 미제공) push 는 하지 않는다.
#    배포는 서버가 클론 후 직접 빌드하는 방식 유지. 여기서는 Dockerfile 빌드 가능 여부만 검증
#  - TLS 없이 2375 로 붙는다 (인증서 공유 볼륨 불필요)
# ---------------------------------------------------------------------------
.build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

collector-image:
  extends: .build-image
  script:
    - docker build -f collector/Dockerfile -t "ddubi/collector:ci-$CI_COMMIT_SHORT_SHA" .

archiver-image:
  extends: .build-image
  script:
    - docker build -f archiver/Dockerfile -t "ddubi/archiver:ci-$CI_COMMIT_SHORT_SHA" .

spark-image:
  extends: .build-image
  script:
    - docker build -f infra/spark/Dockerfile --build-arg SPARK_IMAGE=apache/spark:3.5.3-python3
      -t "ddubi/spark:ci-$CI_COMMIT_SHORT_SHA" .

# 클라이언트 빌드 (수동): 오래 걸려 자동으로 돌리지 않는다. 결과물은 아티팩트로 1일 보관
.flutter-build:
  extends: .flutter
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

client-build-web:
  extends: .flutter-build
  script:
    - flutter build web --release
  artifacts:
    paths: [client/build/web]
    expire_in: 1 day

client-build-android:
  extends: .flutter-build
  image: ghcr.io/gmeligio/flutter-android:3.47.2   # Android SDK 포함 (FE 담당 지정)
  script:
    - flutter build apk --release
  artifacts:
    paths: [client/build/app/outputs/flutter-apk/app-release.apk]
    expire_in: 1 day

# ---------------------------------------------------------------------------
# deploy (수동 승인): 러너(서버2)가 SSH 로 각 서버에 접속해 git pull + compose up
#  - master 에서만 버튼이 생긴다. 검증·테스트 통과 후 사람이 눌러야 배포된다
#  - 준비물: CI/CD 변수 DEPLOY_SSH_KEY(File, Protected) = 서버2의 ~/.ssh/ddubi_deploy 개인키.
#    공개키는 양 서버 authorized_keys 에 from="서버2 IP" 제한으로 등록되어 있다
#  - 서버의 git pull 은 읽기 전용 Deploy Token 이 박힌 HTTPS 리모트를 쓴다 (GitLab SSH 포트 차단됨)
# ---------------------------------------------------------------------------
.deploy:
  stage: deploy
  interruptible: false   # 배포 중(compose up) 새 push 가 와도 취소되지 않게. 중간에 끊기면 컨테이너 일부만 새 버전이 된다
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
  rules:
    # 배포 기준 브랜치는 develop (팀 브랜치 전략: 기능 -> develop 통합 -> master 릴리스).
    # develop 이 보호 브랜치여야 Protected 변수(DEPLOY_SSH_KEY)가 주입된다
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true   # 안 눌러도 파이프라인은 성공으로 끝난다

deploy-server1:
  extends: .deploy
  resource_group: deploy-server1        # 같은 서버에 git pull + compose up 두 개가 동시에 돌지 않게 (버튼 연타·재실행 대비)
  environment: { name: server1-data }
  script:
    - ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@172.26.15.35
      "cd ~/S15P21E202 && git fetch origin && git checkout $CI_COMMIT_BRANCH && git pull --ff-only origin $CI_COMMIT_BRANCH
       && cd infra && docker compose -f docker-compose.yml -f docker-compose.server1.yml
       --profile core --profile collect --profile spark --profile archive --profile hdfs --profile exporters
       up -d --build
       && bash scripts/post-deploy.sh server1"

deploy-server2:
  extends: .deploy
  resource_group: deploy-server2
  environment: { name: server2-service }
  script:
    # 메일·FCM 자격증명을 서버에 먼저 심는다.
    #
    # 소셜 키(GOOGLE/NAVER/KAKAO)는 여기 없다 — 서버 infra/.env 에 이미 있고
    # compose 의 environment: 로 전달된다. 두 곳에 두면 environment 가 이겨서
    # 빈 값이 덮어쓴다.
    #
    # CI/CD 변수는 러너 컨테이너 안에서만 산다. ssh 로 넘어가면 사라지고, 서버의
    # docker compose 는 서버에 있는 파일만 읽는다. 그래서 파일로 만들어 보낸다.
    #
    # 값을 ssh 인자로 넘기지 않고 표준입력으로 보내는 이유: 인자는 서버의 프로세스
    # 목록(ps)에 잠깐이라도 그대로 보인다.
    - |
      {
        echo "MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}"
        echo "MAIL_PORT=${MAIL_PORT:-587}"
        echo "MAIL_USERNAME=$MAIL_USERNAME"
        echo "MAIL_PASSWORD=$MAIL_PASSWORD"
        echo "FIREBASE_CREDENTIALS_BASE64=$FIREBASE_CREDENTIALS_BASE64"
      } | ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@172.26.6.220 "umask 077 && cat > ~/S15P21E202/infra/.env.backend"
    - ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new ubuntu@172.26.6.220
      "cd ~/S15P21E202 && git fetch origin && git checkout $CI_COMMIT_BRANCH && git pull --ff-only origin $CI_COMMIT_BRANCH
       && cd infra && docker compose -f docker-compose.yml -f docker-compose.server2.yml
       --profile data --profile serving --profile hdfs2 --profile monitoring
       up -d --build
       && bash scripts/post-deploy.sh server2"

# 후속 작업
# - backend/**: 이미지 빌드 검증 잡 (backend/Dockerfile 은 있음, backend 팀 요청 시 build 단계에 추가)
# - notification/**: Spring test + image build (배포 프로필에 추가)
