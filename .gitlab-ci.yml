# DDUBI CI
# - MR 파이프라인 우선. MR 이 없는 브랜치 푸시는 브랜치 파이프라인으로 돈다 (중복 실행 방지)
# - 각 컴포넌트는 관련 파일이 바뀔 때만 테스트한다 (rules: changes)
# - sparkjobs 는 클러스터 이미지(apache/spark 3.5.3)와 같은 Python 3.8 로 테스트해 문법 호환까지 확인한다
# - 이미지 빌드는 dind(privileged) 러너가 필요해 수동 잡으로 둔다. 배포는 서버 이식(9단계) 후 추가

stages:
  - validate
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------
structure-check:
  stage: validate
  image: alpine:3.20
  script:
    - test -d client
    - test -d backend
    - test -d notification
    - test -d collector
    - test -d archiver
    - test -d sparkjobs
    - test -d infra
    - test -d docs/contracts
  rules:
    - changes:
        - "**/*"

# compose 문법·변수 참조 검증 (데몬 불필요: config 는 파싱만 한다)
compose-validate:
  stage: validate
  image: docker:27-cli
  script:
    - cd infra
    - cp .env.example .env
    - docker compose --profile core --profile collect --profile data --profile spark
      --profile batch --profile archive --profile hdfs --profile hdfs2 --profile monitoring
      --profile exporters config -q
    # 서버 오버레이 검증 (IP 는 필수 변수라 더미 값 주입)
    - export SERVER1_PRIVATE_IP=10.0.0.1 SERVER2_PRIVATE_IP=10.0.0.2
    - docker compose -f docker-compose.yml -f docker-compose.server1.yml --profile hdfs --profile spark --profile archive config -q
    - docker compose -f docker-compose.yml -f docker-compose.server2.yml --profile data --profile hdfs2 config -q
  rules:
    - changes:
        - infra/**/*

# 계약 파일 파싱 검증 (YAML/JSON 이 깨진 채 병합되는 것 방지)
contracts-validate:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install --quiet pyyaml
    # 한 줄 유지: 여러 줄로 접으면 YAML 이 앞에 공백을 붙여 python -c 가 IndentationError 로 죽는다
    - python -c "import yaml, json, glob; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('docs/contracts/*.yaml')]; [json.load(open(f, encoding='utf-8')) for f in glob.glob('docs/contracts/events/*.json')]; print('contracts OK')"
  rules:
    - changes:
        - docs/contracts/**/*

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
collector-test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [collector/requirements.txt]
    paths: [.cache/pip]
  script:
    - pip install -r collector/requirements.txt
    - cd collector && python -m pytest -q
  rules:
    - changes:
        - collector/**/*
        - docs/contracts/events/*.json   # 계약-모델 일치 테스트가 이 파일들을 읽는다

archiver-test:
  stage: test
  image: python:3.11-slim
  cache:
    key:
      files: [archiver/requirements.txt]
    paths: [.cache/pip]
  script:
    - pip install -r archiver/requirements.txt
    - cd archiver && python -m pytest -q
  rules:
    - changes:
        - archiver/**/*

sparkjobs-test:
  stage: test
  image: python:3.8-slim   # 클러스터(apache/spark:3.5.3-python3)와 같은 파이썬 버전
  cache:
    key:
      files: [sparkjobs/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless > /dev/null
  script:
    - pip install -r sparkjobs/requirements-dev.txt
    - cd sparkjobs && python -m pytest -q
  rules:
    - changes:
        - sparkjobs/**/*

# ---------------------------------------------------------------------------
# build (수동): dind(privileged) 러너에서만 동작한다. 태그는 커밋 SHA 로 고정
# ---------------------------------------------------------------------------
.build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

collector-image:
  extends: .build-image
  script:
    - docker build -f collector/Dockerfile -t "$CI_REGISTRY_IMAGE/collector:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/collector:$CI_COMMIT_SHORT_SHA"

archiver-image:
  extends: .build-image
  script:
    - docker build -f archiver/Dockerfile -t "$CI_REGISTRY_IMAGE/archiver:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/archiver:$CI_COMMIT_SHORT_SHA"

spark-image:
  extends: .build-image
  script:
    - docker build -f infra/spark/Dockerfile --build-arg SPARK_IMAGE=apache/spark:3.5.3-python3
      -t "$CI_REGISTRY_IMAGE/spark:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/spark:$CI_COMMIT_SHORT_SHA"

# 후속 작업
# - client/**: Flutter test + Android/Web build
# - backend/**, notification/**: Spring test + image build
# - deploy: 서버 이식(9단계) 후 수동 승인 배포 추가
